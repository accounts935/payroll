.id === Number(id));\nfunction chain(id, logs = S.logs){\n  const ing = ingById(id), m = logs[id] || {}; let prev = ing.initialStock; const out = [];\n  for (const d of Object.keys(m).sort()){\n    const e = m[d], c = r2(prev + e.in - e.w - e.u);\n    out.push({ date: d, opening: prev, in: e.in, w: e.w, u: e.u, closing: c, notes: e.notes || \"\" });\n    prev = c;\n  }\n  return out;\n}\nconst badDay = (id, logs) => chain(id, logs).find(r => r.closing \u003c -EPS);\nfunction rowFor(ing, date){\n  const c = chain(ing.id), before = c.filter(r => r.date \u003c date), cur = c.find(r => r.date === date);\n  return { opening: before.length ? before[before.length-1].closing : ing.initialStock, in: cur?.in || 0, w: cur?.w || 0, u: cur?.u || 0, notes: cur?.notes || \"\", logged: !!cur };\n}\nfunction current(ing){ const c = chain(ing.id); return c.length ? c[c.length-1].closing : ing.initialStock; }\nfunction clone(o){ return JSON.parse(JSON.stringify(o)); }\n\n/** add (or with negatives, remove) quantities on one ingredient's daily log row. Returns an error string or null. */\nfunction applyDelta(id, date, d){\n  const ing = ingById(id); if (!ing) return \"Ingredient not found\";\n  const logs = clone(S.logs); logs[id] = logs[id] || {};\n  const e = logs[id][date] || { in: 0, w: 0, u: 0, notes: \"\" };\n  const nx = (have, add, label) => { const v = r2(have + (add || 0)); if (v \u003c -EPS) throw `${ing.name}: ${label} on ${fmtDate(date)} can't go below 0 (only ${have} ${ing.unit} recorded)`; return Math.max(0, v); };\n  try { e.in = nx(e.in, d.in, \"Stock In\"); e.w = nx(e.w, d.w, \"Wastage\"); e.u = nx(e.u, d.u, \"Consumption\"); } catch(m){ return m; }\n  logs[id][date] = e;\n  const bad = badDay(id, logs);\n  if (bad) return `${ing.name}: not enough stock — closing would be ${bad.closing} ${ing.unit} on ${fmtDate(bad.date)}`;\n  S.logs = logs; return null;\n}\n\n/* =====================  UI STATE  ===================== */\nconst UI = { view: \"dashboard\", rtype: \"stock\", period: \"daily\", rview: \"summary\", orient: \"portrait\", date: today(), month: today().slice(0, 7), editIng: null, showIngForm: false, usedFor: \"Kitchen\", reason: \"Expired\", pre: \"\", draft: {}, draftDate: \"\" };\nconst NAV = [\n  [\"dashboard\",\"Dashboard\",\"▦\"],[\"daily\",\"Daily Stock Log\",\"☰\"],[\"stockin\",\"Stock In\",\"⬇\"],[\"consumption\",\"Consumption\",\"🔥\"],\n  [\"wastage\",\"Wastage Tracker\",\"🗑\"],[\"inventory\",\"Inventory Master\",\"📦\"],[\"reports\",\"Reports\",\"📊\"],[\"backup\",\"Backup & Data\",\"💾\"]\n];\nconst SUB = {\n  dashboard: \"Low stock, wastage hotspots & stock in at a glance\",\n  daily: \"Opening is carried over; Stock In, Consumption & Wastage entries appear here automatically\",\n  stockin: \"Record incoming stock — it is added to the Daily Stock Log automatically\",\n  consumption: \"Record what the kitchen used — it is added to the Daily Stock Log automatically\",\n  wastage: \"Log why stock was lost — it is added to the Daily Stock Log automatically\",\n  inventory: \"Master list of every ingredient, unit & reorder level\",\n  reports: \"Stock, Stock In and Consumption reports — daily or monthly, exported to A4\",\n  backup: \"Your data lives in the cloud — download a backup file now and then as an extra copy\"\n};\nfunction toast(m, err){ const t = document.createElement(\"div\"); t.className = \"toast\" + (err ? \" err\" : \"\"); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 3200); }\nconst tag = (t, c) => `\u003cspan class=\"tag t-${t}\">${c}\u003c/span>`;\nfunction status(closing, re){ return closing \u003c -EPS ? tag(\"red\",\"Invalid\") : closing \u003c= 0 ? tag(\"red\",\"Out of stock\") : closing \u003c= re ? tag(\"amb\",\"Low — reorder\") : tag(\"grn\",\"Healthy\"); }\nconst opts = (arr, sel) => arr.map(x => `\u003coption ${x === sel ? \"selected\" : \"\"}>${esc(x)}\u003c/option>`).join(\"\");\nconst ingLabel = i => `${i.name} (${i.unit})`;\nfunction resolveIng(txt){\n  const t = (txt || \"\").trim().toLowerCase(); if (!t) return null;\n  let m = S.ing.filter(i => ingLabel(i).toLowerCase() === t);\n  if (m.length !== 1) m = S.ing.filter(i => i.name.toLowerCase() === t);\n  if (m.length !== 1) m = S.ing.filter(i => ingLabel(i).toLowerCase().includes(t));\n  return m.length === 1 ? m[0] : null;\n}\nconst ingPick = (sel, extra) => { const cur = sel ? ingById(sel) : null;\n  return `\u003cinput name=\"ingname\" list=\"ingdl\" autocomplete=\"off\" placeholder=\"Type to search ingredient…\" value=\"${cur ? esc(ingLabel(cur)) : \"\"}\" required>\u003cinput type=\"hidden\" name=\"ing\" value=\"${cur ? cur.id : \"\"}\">\u003cdatalist id=\"ingdl\">${S.ing.slice().sort((a, b) => a.name.localeCompare(b.name)).map(i => `\u003coption value=\"${esc(ingLabel(i))}\"${extra ? ` label=\"${num(current(i))} in stock\"` : \"\"}>\u003c/option>`).join(\"\")}\u003c/datalist>`; };\nconst ingOpts = (sel, extra) => `\u003coption value=\"\">Select…\u003c/option>` + S.ing.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(i => `\u003coption value=\"${i.id}\" ${String(i.id) === String(sel) ? \"selected\" : \"\"}>${esc(i.name)} (${esc(i.unit)})${extra ? \" — \" + num(current(i)) + \" in stock\" : \"\"}\u003c/option>`).join(\"\");\n\n/* =====================  VIEWS  ===================== */\nfunction render(){\n  UI.dirty = false; UI.stale = false;\n  if (!authReady) { $(\"#app\").innerHTML = `\u003cdiv class=\"empty\" style=\"padding:80px\">Loading…\u003c/div>`; return; }\n  if (!user) { $(\"#app\").innerHTML = loginView(); return; }\n  if (UI.fatal) { $(\"#app\").innerHTML = fatalView(); return; }\n  if (!ready) { $(\"#app\").innerHTML = `\u003cdiv class=\"empty\" style=\"padding:80px\">Loading your data from the cloud…\u003c/div>`; return; }\n  applyPage();\n  const low = S.ing.filter(i => current(i) \u003c= i.reorderLevel).length;\n  $(\"#app\").innerHTML = `\n  \u003cdiv class=\"shell\">\n   \u003caside class=\"noprint\">\n    \u003cdiv class=\"brand\" style=\"flex-direction:column;align-items:stretch;gap:6px\">\u003cimg class=\"logoimg\" src=\"${LOGO}\" alt=\"Chouka\">\u003csmall style=\"text-align:center;margin:0\">GUWAHATI\u003c/small>\u003c/div>\n    \u003cnav>${NAV.map(([id,l,ic]) => `\u003cbutton class=\"${UI.view===id?\"on\":\"\"}\" data-a=\"nav\" data-v=\"${id}\">\u003cspan>${ic}\u003c/span>\u003cspan>${l}\u003c/span>${id===\"dashboard\"&&low?`\u003cspan class=\"badge\">${low}\u003c/span>`:\"\"}\u003c/button>`).join(\"\")}\u003c/nav>\n    \u003cdiv class=\"sync\">\u003cb class=\"t\">AUTO-SYNC ACTIVE\u003c/b>\u003cdiv id=\"syncstat\" style=\"font-weight:700;margin-bottom:6px\">\u003c/div>Every \u003cb>Stock In\u003c/b>, \u003cb>Consumption\u003c/b> and \u003cb>Wastage\u003c/b> entry is added to the Daily Stock Log automatically. Yesterday's closing becomes today's opening.\u003ccode>Closing = Open + In − Waste − Used\u003c/code>\u003c/div>\n   \u003c/aside>\n   \u003cmain>\n    \u003cheader class=\"top noprint\">\n      \u003cdiv class=\"ttl\">\u003csmall class=\"b\">CHOUKA GUWAHATI\u003c/small>\u003ch1>${NAV.find(n=>n[0]===UI.view)[1]}\u003c/h1>\u003cp>${SUB[UI.view]}\u003c/p>\u003c/div>\n      \u003cinput type=\"date\" id=\"gdate\" value=\"${UI.date}\" style=\"width:auto\">\u003cspan class=\"muted\">${esc(user.email)}\u003c/span>\u003cbutton class=\"btn sm\" data-a=\"logout\">Sign out\u003c/button>\n    \u003c/header>\n    \u003cdiv class=\"content\">${views[UI.view]()}\u003c/div>\n   \u003c/main>\n  \u003c/div>`;\n  setStat();\n}\n\nconst views = {};\n\n/* ---- Dashboard ---- */\nviews.dashboard = () => {\n  if (!S.ing.length) return emptyState();\n  const d = UI.date, cur = S.ing.map(i => ({ i, c: current(i) }));\n  const lows = cur.filter(x => x.c \u003c= x.i.reorderLevel).sort((a,b) => a.c / (a.i.reorderLevel||1) - b.c / (b.i.reorderLevel||1));\n  const value = cur.reduce((s, x) => s + x.c * x.i.costPerUnit, 0);\n  let tIn = 0, tU = 0, tW = 0; const byDate = {};\n  for (const i of S.ing) for (const r of chain(i.id)) {\n    const b = byDate[r.date] = byDate[r.date] || { in: 0, w: 0, u: 0 }; b.in += r.in; b.w += r.w; b.u += r.u;\n    if (r.date === d) { tIn += r.in; tU += r.u; tW += r.w; }\n  }\n  const dates = Object.keys(byDate).filter(x => x \u003c= d).sort().slice(-7);\n  const mx = Math.max(1, ...dates.flatMap(x => [byDate[x].in, byDate[x].u, byDate[x].w]));\n  const from = addDays(d, -29), wmap = {};\n  for (const w of S.waste) if (w.date >= from && w.date \u003c= d) wmap[w.ing] = (wmap[w.ing] || 0) + w.qty;\n  const hw = Object.entries(wmap).map(([id, q]) => ({ ing: ingById(id), q })).filter(x => x.ing).sort((a,b) => b.q - a.q).slice(0, 5);\n  const rs = {}; for (const w of S.waste) if (w.date >= from && w.date \u003c= d) rs[w.reason] = (rs[w.reason] || 0) + w.qty;\n  const rsl = Object.entries(rs).sort((a,b) => b[1] - a[1]);\n  const rec = S.stockIn.slice().sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 8);\n  const kpi = (l, v, s, c, ic) => `\u003cdiv class=\"card kpi\">\u003cdiv class=\"ic\" style=\"background:${c}\">${ic}\u003c/div>\u003cdiv>\u003csmall>${l}\u003c/small>\u003cdiv class=\"v\">${v}\u003c/div>\u003cdiv class=\"s\">${s}\u003c/div>\u003c/div>\u003c/div>`;\n  return `\u003cdiv class=\"grid\" style=\"gap:18px\">\n   \u003cdiv class=\"grid g4\">\n    ${kpi(\"Ingredients tracked\", S.ing.length, \"in master list\", \"#d97706\", \"▦\")}\n    ${kpi(\"Low / out of stock\", lows.length, `${cur.filter(x => x.c \u003c= 0).length} completely out`, \"#dc2626\", \"!\")}\n    ${kpi(\"Stock value on hand\", money(value), \"at cost per unit\", \"#b45309\", \"₹\")}\n    ${kpi(\"Consumed on \" + d.slice(5), num(tU), `In: ${num(tIn)} • Waste: ${num(tW)}`, \"#44403c\", \"🔥\")}\n   \u003c/div>\n   \u003cdiv class=\"banner dark\" style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:0\">\u003cdiv style=\"flex:1;min-width:220px\">\u003cb>How today starts\u003c/b>\u003cdiv style=\"opacity:.8;font-size:13px;margin-top:3px\">Yesterday's closing is today's opening. Stock In and Consumption entries add themselves to today's log.\u003c/div>\u003c/div>\u003cbutton class=\"btn\" data-a=\"nav\" data-v=\"daily\">Open daily log →\u003c/button>\u003c/div>\n   \u003cdiv class=\"grid g53\">\n    \u003csection class=\"card\">\n      \u003cdiv class=\"hd\">\u003ch3>⚠ Low-stock alerts\u003c/h3>${lows.length ? tag(\"red\", lows.length + \" need reorder\") : tag(\"grn\", \"All stocked ✓\")}\u003c/div>\n      ${lows.length ? lows.map(x => `\u003cdiv class=\"row\">\u003cdiv class=\"m\">\u003cb>${esc(x.i.name)}\u003c/b> \u003cspan class=\"muted\">• ${esc(x.i.category)}\u003c/span>\u003cdiv class=\"bar\">\u003ci style=\"width:${Math.min(100, Math.max(4, x.c / Math.max(1, x.i.reorderLevel * 2) * 100))}%;background:${x.c \u003c= 0 ? \"#dc2626\" : \"#f59e0b\"}\">\u003c/i>\u003c/div>\u003c/div>\u003cdiv style=\"text-align:right\">\u003cb style=\"color:${x.c \u003c= 0 ? \"#dc2626\" : \"#b45309\"}\">${num(x.c)} ${esc(x.i.unit)}\u003c/b>\u003cdiv class=\"muted\">reorder ≤ ${x.i.reorderLevel}\u003c/div>\u003c/div>\u003cbutton class=\"btn pri sm\" data-a=\"reorder\" data-id=\"${x.i.id}\">Stock In\u003c/button>\u003c/div>`).join(\"\") : `\u003cdiv class=\"empty\">No ingredients at or below reorder level.\u003c/div>`}\n      \u003cdiv class=\"pad\" style=\"border-top:1px solid #f3e3b0\">\u003cdiv class=\"muted\" style=\"font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\">Last 7 days — Stock In vs Consumption vs Wastage\u003c/div>\n      ${dates.length ? `\u003cdiv class=\"trend\">${dates.map(x => `\u003cdiv>\u003cdiv class=\"bs\">\u003ci style=\"background:#10b981;height:${Math.max(3, byDate[x].in / mx * 92)}px\" title=\"In ${num(byDate[x].in)}\">\u003c/i>\u003ci style=\"background:#44403c;height:${Math.max(3, byDate[x].u / mx * 92)}px\" title=\"Consumed ${num(byDate[x].u)}\">\u003c/i>\u003ci style=\"background:#f87171;height:${Math.max(3, byDate[x].w / mx * 92)}px\" title=\"Waste ${num(byDate[x].w)}\">\u003c/i>\u003c/div>${x.slice(5)}\u003c/div>`).join(\"\")}\u003c/div>\u003cdiv class=\"muted\" style=\"margin-top:6px\">🟩 Stock In &nbsp; ⬛ Consumption &nbsp; 🟥 Wastage\u003c/div>` : `\u003cdiv class=\"muted\">No logs yet.\u003c/div>`}\u003c/div>\n    \u003c/section>\n    \u003cdiv class=\"grid\">\n     \u003csection class=\"card\">\u003cdiv class=\"hd\">\u003ch3>↘ Highest wastage (30 days)\u003c/h3>\u003c/div>\u003cdiv class=\"pad\">${hw.map(w => `\u003cdiv style=\"display:flex;justify-content:space-between;margin-bottom:10px\">\u003cdiv>\u003cb>${esc(w.ing.name)}\u003c/b>\u003cdiv class=\"muted\">≈ ${money(w.q * w.ing.costPerUnit)} lost\u003c/div>\u003c/div>${tag(\"red\", num(w.q) + \" \" + esc(w.ing.unit))}\u003c/div>`).join(\"\") || `\u003cdiv class=\"muted\">No wastage recorded yet.\u003c/div>`}\n      ${rsl.map(([r, q]) => `\u003cdiv style=\"display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0\">\u003cspan style=\"width:84px;color:var(--mut)\">${esc(r)}\u003c/span>\u003cdiv class=\"bar\" style=\"flex:1;margin:0\">\u003ci style=\"background:#f87171;width:${q / rsl[0][1] * 100}%\">\u003c/i>\u003c/div>\u003cb style=\"width:42px;text-align:right\">${num(q)}\u003c/b>\u003c/div>`).join(\"\")}\u003c/div>\u003c/section>\n     \u003csection class=\"card\">\u003cdiv class=\"hd\">\u003ch3>⬇ Recent Stock In\u003c/h3>\u003cbutton class=\"btn sm\" data-a=\"nav\" data-v=\"stockin\">View all →\u003c/button>\u003c/div>${rec.map(x => { const i = ingById(x.ing); return `\u003cdiv class=\"row\">\u003cdiv class=\"m\">\u003cb>${esc(i?.name)}\u003c/b> \u003cb style=\"color:var(--grn)\">+${num(x.qty)} ${esc(i?.unit)}\u003c/b>\u003cdiv class=\"muted\">${esc(x.supplier)} ${x.invoice ? \"• \" + esc(x.invoice) : \"\"}\u003c/div>\u003c/div>\u003cspan class=\"muted\">${x.date}\u003c/span>\u003c/div>`; }).join(\"\") || `\u003cdiv class=\"empty\">No stock in recorded yet.\u003c/div>`}\u003c/section>\n    \u003c/div>\n   \u003c/div>\u003c/div>`;\n};\n\nfunction emptyState(){\n  return `\u003cdiv class=\"card empty\" style=\"padding:50px\">\u003ch2 style=\"margin:0 0 8px\">Welcome to CHOUKA GUWAHATI stock\u003c/h2>\u003cp>Add your ingredients in \u003cb>Inventory Master\u003c/b> (set each ingredient's starting stock), or load a sample list to try the app.\u003c/p>\u003cp style=\"margin-top:18px\">\u003cbutton class=\"btn pri\" data-a=\"nav\" data-v=\"inventory\">Add ingredients\u003c/button> &nbsp; \u003cbutton class=\"btn\" data-a=\"sample\">Load sample ingredients\u003c/button>\u003c/p>\u003c/div>`;\n}\n\n/* ---- Daily Stock Log ---- */\nfunction buildDraft(){\n  UI.draft = {}; UI.draftDate = UI.date;\n  for (const i of S.ing) { const r = rowFor(i, UI.date); UI.draft[i.id] = { open: r.opening, in: r.in, w: r.w, u: r.u, notes: r.notes, logged: r.logged }; }\n}\nviews.daily = () => {\n  if (!S.ing.length) return emptyState();\n  buildDraft();\n  const first = UI.date.endsWith(\"-01\");\n  const rows = S.ing.slice().sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));\n  const logged = rows.filter(i => UI.draft[i.id].logged).length;\n  return `\u003cdiv class=\"banner\" style=\"${first ? \"background:#d97706\" : \"\"}\">${first ? \"\u003cb>Monthly rollover:\u003c/b> Opening stock below is last month's final closing stock (carried over automatically).\" : \"\u003cb>Daily rollover active:\u003c/b> Opening = yesterday's closing.\"} Closing = Opening + Stock In − Wastage − Consumption. Entries from the Stock In, Consumption and Wastage pages are added here automatically. Negative closing is blocked.\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"pad\" style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #f3e3b0\">\n    \u003cbutton class=\"btn ic\" data-a=\"step\" data-n=\"-1\">‹\u003c/button>\u003cdiv style=\"text-align:center;padding:0 4px\">\u003cb style=\"font-size:15px\">${fmtDate(UI.date)}\u003c/b>\u003cdiv class=\"muted\">${logged} of ${rows.length} ingredients already logged\u003c/div>\u003c/div>\u003cbutton class=\"btn ic\" data-a=\"step\" data-n=\"1\">›\u003c/button>\u003cbutton class=\"btn sm\" data-a=\"today\">Today\u003c/button>\n    \u003cdiv style=\"margin-left:auto;display:flex;gap:8px;flex-wrap:wrap\">\u003cbutton class=\"btn\" data-a=\"nav\" data-v=\"stockin\">⬇ Stock In\u003c/button>\u003cbutton class=\"btn\" data-a=\"nav\" data-v=\"consumption\">🔥 Consumption\u003c/button>\u003cbutton class=\"btn pri\" data-a=\"savedaily\">Save all &amp; close day\u003c/button>\u003c/div>\u003c/div>\n  \u003cdiv class=\"scroll\">\u003ctable class=\"t dl\" style=\"min-width:860px\">\u003cthead>\u003ctr>\u003cth>Ingredient\u003c/th>\u003cth>Opening (auto)\u003c/th>\u003cth>+ Stock In\u003c/th>\u003cth>− Wastage\u003c/th>\u003cth>− Consumption\u003c/th>\u003cth>= Closing (auto)\u003c/th>\u003cth>Status\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n  ${rows.map(i => { const d = UI.draft[i.id], c = r2(d.open + d.in - d.w - d.u); return `\u003ctr>\u003ctd>\u003cb>${esc(i.name)}\u003c/b>\u003cdiv class=\"muted\">${esc(i.category)} • reorder ≤ ${i.reorderLevel} ${esc(i.unit)}\u003c/div>\u003c/td>\u003ctd>\u003cspan class=\"nb\">${num(d.open)} \u003csmall class=\"muted\">${esc(i.unit)}\u003c/small>\u003c/span>\u003c/td>\n   \u003ctd class=\"in\">\u003cinput type=\"number\" min=\"0\" step=\"0.01\" placeholder=\"0\" value=\"${d.in || \"\"}\" data-dl=\"in\" data-id=\"${i.id}\">\u003c/td>\u003ctd class=\"wa\">\u003cinput type=\"number\" min=\"0\" step=\"0.01\" placeholder=\"0\" value=\"${d.w || \"\"}\" data-dl=\"w\" data-id=\"${i.id}\">\u003c/td>\u003ctd>\u003cinput type=\"number\" min=\"0\" step=\"0.01\" placeholder=\"0\" value=\"${d.u || \"\"}\" data-dl=\"u\" data-id=\"${i.id}\">\u003c/td>\n   \u003ctd id=\"cl-${i.id}\">\u003cb style=\"font-size:15px;color:${c \u003c 0 ? \"#dc2626\" : c \u003c= i.reorderLevel ? \"#b45309\" : \"#047857\"}\">${num(c)}\u003c/b> \u003cspan class=\"muted\">${esc(i.unit)}\u003c/span>\u003c/td>\u003ctd id=\"st-${i.id}\">${status(c, i.reorderLevel)}\u003c/td>\u003c/tr>`; }).join(\"\")}\n  \u003c/tbody>\u003c/table>\u003c/div>\n  \u003cdiv class=\"pad muted\" style=\"border-top:1px solid #f3e3b0\">Saving locks these closing figures. Tomorrow (and the 1st of next month) will open with exactly these numbers. Entries added on the Stock In, Consumption and Wastage pages are already included.\u003c/div>\u003c/div>`;\n};\nfunction dlUpdate(id){\n  const i = ingById(id), d = UI.draft[id], c = r2(d.open + d.in - d.w - d.u);\n  $(\"#cl-\" + id).innerHTML = `\u003cb style=\"font-size:15px;color:${c \u003c 0 ? \"#dc2626\" : c \u003c= i.reorderLevel ? \"#b45309\" : \"#047857\"}\">${num(c)}\u003c/b> \u003cspan class=\"muted\">${esc(i.unit)}\u003c/span>`;\n  $(\"#st-\" + id).innerHTML = status(c, i.reorderLevel);\n}\nfunction saveDaily(){\n  const logs = clone(S.logs), errs = [];\n  for (const i of S.ing) {\n    const d = UI.draft[i.id]; if (!d) continue;\n    if (d.in \u003c 0 || d.w \u003c 0 || d.u \u003c 0) { errs.push(`${i.name}: negative values not allowed`); continue; }\n    if (!d.logged && !d.in && !d.w && !d.u) continue;\n    logs[i.id] = logs[i.id] || {};\n    logs[i.id][UI.date] = { in: d.in, w: d.w, u: d.u, notes: d.notes || \"\" };\n  }\n  if (!errs.length) for (const i of S.ing) { const b = badDay(i.id, logs); if (b) errs.push(`${i.name}: closing would be ${b.closing} on ${fmtDate(b.date)} — reduce wastage / consumption or add stock in`); }\n  if (errs.length) return toast(errs.slice(0, 3).join(\"  •  \"), true);\n  S.logs = logs; save(); toast(`Daily log saved for ${fmtDate(UI.date)} — closing stock rolls over to tomorrow.`); render();\n}\n\n/* ---- Entry pages ---- */\nfunction entryForm(kind){\n  const d = UI.entryDate || UI.date;\n  if (kind === \"stockin\") return `\u003cform data-form=\"stockin\" class=\"card pad\">\n    \u003ch3>Record Stock In\u003c/h3>\n    \u003clabel>Ingredient *\u003c/label>${ingPick(UI.pre)}\n    \u003cdiv class=\"f2\">\u003cdiv>\u003clabel>Date\u003c/label>\u003cinput type=\"date\" name=\"date\" value=\"${d}\" required>\u003c/div>\u003cdiv>\u003clabel>Qty *\u003c/label>\u003cinput type=\"number\" name=\"qty\" min=\"0.01\" step=\"0.01\" required>\u003c/div>\u003c/div>\n    \u003clabel>Supplier\u003c/label>\u003cinput name=\"supplier\" value=\"${esc(UI.pre ? ingById(UI.pre)?.supplier : \"\")}\">\n    \u003cdiv class=\"f2\">\u003cdiv>\u003clabel>Invoice no\u003c/label>\u003cinput name=\"invoice\" placeholder=\"INV-2401\">\u003c/div>\u003cdiv>\u003clabel>Total cost (₹)\u003c/label>\u003cinput type=\"number\" name=\"cost\" min=\"0\" step=\"0.01\">\u003c/div>\u003c/div>\n    \u003clabel>Notes\u003c/label>\u003cinput name=\"notes\" placeholder=\"Optional\">\n    \u003cbutton class=\"btn pri\" style=\"width:100%;margin-top:14px\">Save Stock In\u003c/button>\n    \u003cp class=\"muted\">Saved quantity is added to that day's \u003cb>Daily Stock Log → Stock In\u003c/b> automatically — no need to type it twice.\u003c/p>\u003c/form>`;\n  if (kind === \"consumption\") return `\u003cform data-form=\"consumption\" class=\"card pad\">\n    \u003ch3>Record Consumption\u003c/h3>\n    \u003clabel>Ingredient *\u003c/label>${ingPick(\"\", true)}\n    \u003cdiv class=\"f2\">\u003cdiv>\u003clabel>Date\u003c/label>\u003cinput type=\"date\" name=\"date\" value=\"${d}\" required>\u003c/div>\u003cdiv>\u003clabel>Qty *\u003c/label>\u003cinput type=\"number\" name=\"qty\" min=\"0.01\" step=\"0.01\" required>\u003c/div>\u003c/div>\n    \u003clabel>Used for\u003c/label>\u003cdiv class=\"chips\">${USEDFOR.map(x => `\u003cspan class=\"chip ${UI.usedFor === x ? \"on\" : \"\"}\" data-a=\"usedfor\" data-v=\"${x}\">${x}\u003c/span>`).join(\"\")}\u003c/div>\n    \u003clabel>Staff name\u003c/label>\u003cinput name=\"staff\">\u003clabel>Notes\u003c/label>\u003cinput name=\"notes\" placeholder=\"Optional\">\n    \u003cbutton class=\"btn pri\" style=\"width:100%;margin-top:14px\">Save Consumption\u003c/button>\n    \u003cp class=\"muted\">Saved quantity is added to that day's \u003cb>Daily Stock Log → Consumption\u003c/b> automatically. An entry bigger than the available stock is refused.\u003c/p>\u003c/form>`;\n  return `\u003cform data-form=\"wastage\" class=\"card pad\">\n    \u003ch3>Record wastage\u003c/h3>\n    \u003clabel>Ingredient *\u003c/label>${ingPick(\"\", true)}\n    \u003cdiv class=\"f2\">\u003cdiv>\u003clabel>Date\u003c/label>\u003cinput type=\"date\" name=\"date\" value=\"${d}\" required>\u003c/div>\u003cdiv>\u003clabel>Qty *\u003c/label>\u003cinput type=\"number\" name=\"qty\" min=\"0.01\" step=\"0.01\" required>\u003c/div>\u003c/div>\n    \u003clabel>Reason\u003c/label>\u003cdiv class=\"chips\">${REASONS.map(x => `\u003cspan class=\"chip ${UI.reason === x ? \"on\" : \"\"}\" data-a=\"reason\" data-v=\"${x}\">${x}\u003c/span>`).join(\"\")}\u003c/div>\n    \u003clabel>Staff name\u003c/label>\u003cinput name=\"staff\">\u003clabel>Notes\u003c/label>\u003ctextarea name=\"notes\" rows=\"2\" placeholder=\"What happened?\">\u003c/textarea>\n    \u003cbutton class=\"btn red\" style=\"width:100%;margin-top:14px\">Save wastage entry\u003c/button>\n    \u003cp class=\"muted\">The quantity is added to that day's Daily Stock Log → Wastage column automatically.\u003c/p>\u003c/form>`;\n}\nfunction entryList(arr, kind){\n  const sorted = arr.slice().sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 300);\n  const title = { stockin: \"Stock In history\", consumption: \"Consumption history\", wastage: \"Wastage log\" }[kind];\n  return `\u003cdiv class=\"card\">\u003cdiv class=\"hd\">\u003cspan>${title}\u003c/span>${tag(\"amb\", arr.length + \" entries\")}\u003c/div>\u003cdiv class=\"list\">${sorted.map(x => { const i = ingById(x.ing);\n    const main = kind === \"stockin\" ? `\u003cb>${esc(i?.name)}\u003c/b> \u003cb style=\"color:var(--grn)\">+${num(x.qty)} ${esc(i?.unit)}\u003c/b>\u003cdiv class=\"muted\">${esc(x.supplier)} ${x.invoice ? \"• \" + esc(x.invoice) : \"\"} ${x.cost ? \"• \" + money(x.cost) : \"\"}\u003c/div>`\n      : kind === \"consumption\" ? `\u003cb>${esc(i?.name)}\u003c/b> \u003cb>−${num(x.qty)} ${esc(i?.unit)}\u003c/b> ${tag(\"gry\", esc(x.usedFor))}\u003cdiv class=\"muted\">${esc(x.notes) || \"No notes\"} ${x.staff ? \"• by \" + esc(x.staff) : \"\"}\u003c/div>`\n      : `\u003cb>${esc(i?.name)}\u003c/b> — ${num(x.qty)} ${esc(i?.unit)} ${tag(\"red\", esc(x.reason))}\u003cdiv class=\"muted\">${esc(x.notes) || \"No notes\"} ${x.staff ? \"• by \" + esc(x.staff) : \"\"}\u003c/div>`;\n    return `\u003cdiv class=\"row\">\u003cdiv class=\"m\">${main}\u003c/div>\u003cspan class=\"muted\">${x.date}\u003c/span>\u003cbutton class=\"btn sm\" title=\"Delete\" data-a=\"delentry\" data-k=\"${kind}\" data-id=\"${x.id}\">🗑\u003c/button>\u003c/div>`; }).join(\"\") || `\u003cdiv class=\"empty\">Nothing recorded yet.\u003c/div>`}\u003c/div>\u003c/div>`;\n}\nconst entryPage = kind => () => S.ing.length ? `\u003cdiv class=\"grid g3\" style=\"align-items:start\">${entryForm(kind)}${entryList({ stockin: S.stockIn, consumption: S.cons, wastage: S.waste }[kind], kind)}\u003c/div>` : emptyState();\nviews.stockin = entryPage(\"stockin\"); views.consumption = entryPage(\"consumption\"); views.wastage = entryPage(\"wastage\");\n\n/* ---- Inventory ---- */\nfunction ingForm(){\n  const e = UI.editIng ? ingById(UI.editIng) : null, v = e || { name: \"\", category: \"Vegetables\", unit: \"kg\", reorderLevel: 5, initialStock: 0, supplier: \"\", costPerUnit: 0, storage: \"Open Storage\", notes: \"\" };\n  return `\u003cform data-form=\"ing\" class=\"card pad\" style=\"border:2px solid rgba(217,119,6,.5);margin-bottom:16px\">\u003cdiv class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 12px\">\n   \u003cdiv style=\"grid-column:span 2\">\u003clabel>Name *\u003c/label>\u003cinput name=\"name\" required value=\"${esc(v.name)}\" placeholder=\"e.g. Chicken Breast\">\u003c/div>\n   \u003cdiv>\u003clabel>Category\u003c/label>\u003cselect name=\"category\">${opts(CATS, v.category)}\u003c/select>\u003c/div>\u003cdiv>\u003clabel>Unit\u003c/label>\u003cselect name=\"unit\">${opts(UNITS, v.unit)}\u003c/select>\u003c/div>\n   \u003cdiv>\u003clabel>Min reorder level\u003c/label>\u003cinput type=\"number\" name=\"reorderLevel\" min=\"0\" step=\"0.01\" value=\"${v.reorderLevel}\">\u003c/div>\n   \u003cdiv>\u003clabel>${e ? \"Initial stock (seed)\" : \"Opening / initial stock\"}\u003c/label>\u003cinput type=\"number\" name=\"initialStock\" min=\"0\" step=\"0.01\" value=\"${v.initialStock}\">\u003c/div>\n   \u003cdiv>\u003clabel>Cost / unit (₹)\u003c/label>\u003cinput type=\"number\" name=\"costPerUnit\" min=\"0\" step=\"0.01\" value=\"${v.costPerUnit}\">\u003c/div>\n   \u003cdiv>\u003clabel>Supplier\u003c/label>\u003cinput name=\"supplier\" value=\"${esc(v.supplier)}\">\u003c/div>\u003cdiv>\u003clabel>Storage\u003c/label>\u003cselect name=\"storage\">${opts(STORES, v.storage)}\u003c/select>\u003c/div>\n   \u003cdiv style=\"grid-column:span 2\">\u003clabel>Notes\u003c/label>\u003cinput name=\"notes\" value=\"${esc(v.notes)}\" placeholder=\"Optional\">\u003c/div>\u003c/div>\n   \u003cdiv style=\"margin-top:14px;display:flex;gap:8px\">\u003cbutton class=\"btn pri\">${e ? \"Update\" : \"Add ingredient\"}\u003c/button>\u003cbutton type=\"button\" class=\"btn\" data-a=\"cancelIng\">Cancel\u003c/button>\u003c/div>\u003c/form>`;\n}\nviews.inventory = () => {\n  const cats = [\"All\", ...CATS];\n  return `\u003cdiv style=\"display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px\">\u003cinput id=\"isearch\" placeholder=\"Search ingredients…\" style=\"flex:1;min-width:200px\">\u003cselect id=\"icat\" style=\"width:auto\">${cats.map(c => `\u003coption>${c}\u003c/option>`).join(\"\")}\u003c/select>\u003cbutton class=\"btn pri\" data-a=\"addIng\">＋ Add ingredient\u003c/button>\u003c/div>\n  ${UI.showIngForm ? ingForm() : \"\"}\n  \u003cdiv class=\"grid gc\" id=\"icards\">${S.ing.slice().sort((a,b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name)).map(i => { const c = current(i), lowc = c \u003c= i.reorderLevel, last = chain(i.id).slice(-1)[0];\n    return `\u003cdiv class=\"card pad\" data-name=\"${esc(i.name.toLowerCase())}\" data-cat=\"${esc(i.category)}\" style=\"${lowc ? \"border-color:#fca5a5\" : \"\"}\">\u003cdiv style=\"display:flex;justify-content:space-between;gap:8px\">\u003cdiv>\u003cb>${esc(i.name)}\u003c/b>\u003cdiv class=\"muted\">${esc(i.category)} • ${esc(i.storage)}\u003c/div>\u003c/div>${c \u003c= 0 ? tag(\"red\", \"Out\") : lowc ? tag(\"amb\", \"Low stock\") : tag(\"grn\", \"In stock\")}\u003c/div>\n    \u003cdiv style=\"display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px\">\u003cdiv>\u003cdiv style=\"font-size:24px;font-weight:900\">${num(c)} \u003csmall class=\"muted\">${esc(i.unit)}\u003c/small>\u003c/div>\u003cdiv class=\"muted\">reorder at ≤ ${i.reorderLevel} • ${money(i.costPerUnit)}/${esc(i.unit)}\u003c/div>\u003c/div>\u003cb class=\"muted\">${money(c * i.costPerUnit)} value\u003c/b>\u003c/div>\n    \u003cdiv class=\"bar\" style=\"height:8px\">\u003ci style=\"width:${Math.min(100, Math.max(3, c / Math.max(1, i.reorderLevel * 3) * 100))}%;background:${lowc ? \"#f87171\" : \"#10b981\"}\">\u003c/i>\u003c/div>\n    \u003cdiv class=\"muted\" style=\"margin-top:8px\">${esc(i.supplier) || \"No supplier\"} ${last ? \"• Last logged \" + last.date : \"\"}\u003c/div>\n    \u003cdiv style=\"display:flex;gap:8px;margin-top:12px\">\u003cbutton class=\"btn sm\" style=\"flex:1\" data-a=\"editIng\" data-id=\"${i.id}\">✎ Edit\u003c/button>\u003cbutton class=\"btn sm\" style=\"flex:1\" data-a=\"logToday\">Log today\u003c/button>\u003cbutton class=\"btn sm\" data-a=\"delIng\" data-id=\"${i.id}\" style=\"color:#b91c1c\">🗑\u003c/button>\u003c/div>\u003c/div>`; }).join(\"\") || `\u003cdiv class=\"card empty\" style=\"grid-column:1/-1\">No ingredients yet. Add your first one above.\u003c/div>`}\u003c/div>`;\n};\n\n/* ---- Reports ---- */\nconst RT = [[\"stock\",\"Stock report\"],[\"in\",\"Stock In report\"],[\"cons\",\"Consumption report\"]];\nfunction applyPage(){\n  let st = document.getElementById(\"pagestyle\");\n  if (!st) { st = document.createElement(\"style\"); st.id = \"pagestyle\"; document.head.appendChild(st); }\n  st.textContent = `@page{size:A4 ${UI.orient};margin:10mm}`;\n}\nfunction cell(c, v){\n  if (c.t === \"m\") return money(v);\n  if (c.t === \"n\") return v === \"\" || v == null ? \"–\" : num(v);\n  if (c.t === \"nz\") return v ? num(v) : \"–\";\n  if (c.t === \"b\") return `\u003cb>${num(v)}\u003c/b>`;\n  if (c.t === \"p\") return v === \"\" || v == null ? \"–\" : v + \"%\";\n  return v === \"\" || v == null ? \"–\" : esc(v);\n}\nfunction tableHTML(cols, rows, foot, cls){\n  const vis = cols.map((c, i) => i).filter(i => !cols[i].csv), al = c => c.a === \"r\" ? \"r\" : c.a === \"c\" ? \"c\" : \"\";\n  return `\u003ctable class=\"sheet-table ${cls || \"\"}\">\u003ccolgroup>${vis.map(i => `\u003ccol style=\"width:${cols[i].w}\">`).join(\"\")}\u003c/colgroup>\u003cthead>\u003ctr>${vis.map(i => `\u003cth class=\"${al(cols[i])}\">${cols[i].l}\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(r => r.hdr !== undefined ? `\u003ctr class=\"cat-h\">\u003ctd colspan=\"${vis.length}\">${esc(r.hdr)}\u003c/td>\u003c/tr>` : r.sub ? `\u003ctr class=\"cat-s\">${vis.map(i => `\u003ctd class=\"${al(cols[i])}\">${r.sub[i] === \"\" || r.sub[i] == null ? \"\" : cell(cols[i], r.sub[i])}\u003c/td>`).join(\"\")}\u003c/tr>` : `\u003ctr>${vis.map(i => `\u003ctd class=\"${al(cols[i])}\">${cell(cols[i], r[i])}\u003c/td>`).join(\"\")}\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"${vis.length}\" class=\"c\">No data for this period.\u003c/td>\u003c/tr>`}\u003c/tbody>${foot ? `\u003ctfoot>\u003ctr>${foot.map((x, j) => `\u003ctd class=\"${al(cols[vis[j]])}\">${x}\u003c/td>`).join(\"\")}\u003c/tr>\u003c/tfoot>` : \"\"}\u003c/table>`;\n}\nconst extraTable = (title, cols, rows) => `\u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">${title}\u003c/div>\u003cdiv class=\"sheet-scroll\">${tableHTML(cols, rows, null, \"sub\")}\u003c/div>\u003c/div>`;\nfunction sheet(o){\n  const n = o.rows.length, avail = UI.orient === \"landscape\" ? 100 : 175, rowMm = Math.min(8, Math.max(5.2, avail / (n + 2))), font = Math.min(12, Math.max(8, rowMm * 3.78 * 0.42));\n  return `\u003cdiv class=\"rpt\" style=\"--row-h:${rowMm.toFixed(2)}mm;--row-font:${font.toFixed(1)}px\">\n   \u003cdiv class=\"sh-top\">\u003cdiv>\u003cimg class=\"sheet-logo\" src=\"${LOGO}\" alt=\"Chouka\">\u003cdiv class=\"sheet-brand\">GUWAHATI\u003c/div>\u003cdiv class=\"sheet-title\">${o.title}\u003c/div>\u003c/div>\u003cdiv>\u003cdiv class=\"sheet-sub\">${o.subtitle}\u003c/div>\u003cdiv class=\"sheet-meta\">Generated ${new Date().toLocaleString(\"en-IN\", { dateStyle: \"medium\", timeStyle: \"short\" })}\u003c/div>\u003c/div>\u003c/div>\n   \u003cdiv class=\"sum5\">${o.summary.map(x => `\u003cdiv class=\"sc\">\u003csmall>${x[0]}\u003c/small>\u003cb>${x[1]}\u003c/b>\u003c/div>`).join(\"\")}\u003c/div>\n   \u003cdiv class=\"sheet-scroll\">${tableHTML(o.cols, o.rows, o.foot)}\u003c/div>\n   ${o.extra || \"\"}\n   \u003cdiv class=\"sheet-note\">${o.note}\u003c/div>\n   \u003cdiv class=\"sheet-sign\">\u003cdiv>\u003cspan>\u003c/span>Prepared by\u003c/div>\u003cdiv>\u003cspan>\u003c/span>Kitchen / Store Manager\u003c/div>\u003cdiv>\u003cspan>\u003c/span>Verified by\u003c/div>\u003c/div>\n   \u003cdiv class=\"sheet-note\" style=\"text-align:center;margin-top:14px\">Generated from Chouka Management Software\u003c/div>\u003c/div>`;\n}\n\nfunction dailyData(date){\n  return S.ing.slice().sort((a, b) => a.name.localeCompare(b.name)).map(i => { const r = rowFor(i, date), c = r2(r.opening + r.in - r.w - r.u); return { i, r, c }; });\n}\nfunction monthData(m){\n  const start = m + \"-01\", end = nextMonth(m);\n  return S.ing.slice().sort((a, b) => a.name.localeCompare(b.name)).map(i => {\n    const c = chain(i.id), before = c.filter(r => r.date \u003c start), inM = c.filter(r => r.date >= start && r.date \u003c end);\n    const opening = before.length ? before[before.length - 1].closing : (inM.length ? inM[0].opening : i.initialStock);\n    const tin = r2(inM.reduce((s, r) => s + r.in, 0)), tw = r2(inM.reduce((s, r) => s + r.w, 0)), tu = r2(inM.reduce((s, r) => s + r.u, 0));\n    const closing = inM.length ? inM[inM.length - 1].closing : opening;\n    const wp = tu + tw > 0 ? Math.round(tw / (tu + tw) * 1000) / 10 : 0;\n    return { i, opening, tin, tw, tu, closing, wp, val: r2(closing * i.costPerUnit), inV: r2(tin * i.costPerUnit), uV: r2(tu * i.costPerUnit), wV: r2(tw * i.costPerUnit) };\n  });\n}\nconst ingName = id => ingById(id)?.name || \"?\";\nconst ingUnit = id => ingById(id)?.unit || \"\";\nfunction entryValue(kind, x){ const i = ingById(x.ing); return r2(kind === \"in\" && x.cost > 0 ? x.cost : x.qty * (i ? i.costPerUnit : 0)); }\n/** Entries for Stock In (\"in\") or Consumption (\"cons\") between start and end (exclusive). Quantities typed straight into the Daily Stock Log are added as \"Daily log\" rows so reports always match the ledger. */\nfunction gather(kind, start, end){\n  const arr = kind === \"in\" ? S.stockIn : S.cons, key = kind === \"in\" ? \"in\" : \"u\";\n  const out = arr.filter(x => x.date >= start && x.date \u003c end && ingById(x.ing)).map(x => ({ ...x })), have = {};\n  for (const x of out) have[x.ing + \"|\" + x.date] = r2((have[x.ing + \"|\" + x.date] || 0) + x.qty);\n  for (const i of S.ing) for (const r of chain(i.id)) if (r.date >= start && r.date \u003c end) {\n    const rem = r2(r[key] - (have[i.id + \"|\" + r.date] || 0));\n    if (rem > EPS) out.push({ id: 0, ing: i.id, date: r.date, qty: rem, supplier: \"\", invoice: \"Daily log\", cost: 0, usedFor: \"Daily log\", staff: \"\", notes: \"Entered in Daily Stock Log\" });\n  }\n  return out.sort((a, b) => a.date.localeCompare(b.date) || ingName(a.ing).localeCompare(ingName(b.ing)));\n}\n\n/** Groups report rows by ingredient category, adds a subtotal row after each category and returns the grand-total footer.\n *  o = { cols, sums:[column indexes to total], label:column index for the caption, post(row) to recompute derived columns } */\nfunction groupByCat(items, catFn, rowFn, o){\n  const by = {};\n  for (const it of items) { const c = catFn(it) || \"Other\"; (by[c] = by[c] || []).push(it); }\n  const ord = c => { const k = CATS.indexOf(c); return k \u003c 0 ? 999 : k; };\n  const cats = Object.keys(by).sort((a, b) => ord(a) - ord(b) || a.localeCompare(b));\n  const blank = () => new Array(o.cols.length).fill(\"\"), rows = [], data = [], tot = blank();\n  let k = 0;\n  for (const c of cats) {\n    rows.push({ hdr: c });\n    const sub = blank();\n    for (const it of by[c]) { const r = rowFn(it, ++k); rows.push(r); data.push(r); for (const j of o.sums) { sub[j] = r2((sub[j] || 0) + (Number(r[j]) || 0)); tot[j] = r2((tot[j] || 0) + (Number(r[j]) || 0)); } }\n    sub[o.label] = \"Subtotal – \" + c; if (o.post) o.post(sub); rows.push({ sub });\n  }\n  if (o.post) o.post(tot);\n  const foot = o.cols.map((c, i) => i).filter(i => !o.cols[i].csv).map(i => i === o.label ? \"GRAND TOTAL\" : (o.sums.includes(i) ? cell(o.cols[i], tot[i]) : \"\"));\n  return { rows, data, foot };\n}\nconst catOf = id => ingById(id)?.category || \"Other\";\n\nfunction reportModel(){\n  const daily = UI.period === \"daily\", t = UI.rtype, P = daily ? \"Daily\" : \"Monthly\";\n  const R = daily ? { start: UI.date, end: addDays(UI.date, 1), label: fmtDate(UI.date), key: UI.date } : { start: UI.month + \"-01\", end: nextMonth(UI.month), label: monthLabel(UI.month), key: UI.month };\n  let o;\n  if (t === \"stock\") {\n    if (daily) {\n      const D = dailyData(UI.date), sum = f => r2(D.reduce((a, x) => a + f(x), 0)), tv = sum(x => x.c * x.i.costPerUnit);\n      o = { title: \"Daily Stock Report\", subtitle: R.label,\n        summary: [[\"Ingredients\", D.length], [\"Stock In value\", money(sum(x => x.r.in * x.i.costPerUnit))], [\"Consumption value\", money(sum(x => x.r.u * x.i.costPerUnit))], [\"Wastage value\", money(sum(x => x.r.w * x.i.costPerUnit))], [\"Closing stock value\", money(tv)]],\n        cols: [{ l: \"#\", w: \"5%\", a: \"c\", nocsv: 1 }, { l: \"Ingredient\", w: \"25%\" }, { l: \"Category\", csv: 1 }, { l: \"Unit\", w: \"7%\" }, { l: \"Opening\", w: \"10%\", a: \"r\", t: \"n\" }, { l: \"Stock In\", w: \"10%\", a: \"r\", t: \"nz\" }, { l: \"Wastage\", w: \"10%\", a: \"r\", t: \"nz\" }, { l: \"Consumption\", w: \"13%\", a: \"r\", t: \"nz\" }, { l: \"Closing\", w: \"10%\", a: \"r\", t: \"b\" }, { l: \"Value (₹)\", w: \"10%\", a: \"r\", t: \"m\" }],\n        rows: [],\n        foot: [],\n        note: `Ingredients are grouped category-wise with a subtotal for each category and a grand total. Closing = Opening + Stock In − Wastage − Consumption. Quantity totals add the numbers across units (kg, pcs, plate…); the Value (₹) total is the reliable figure. Values are at cost per unit, in Indian Rupees (₹). ${D.filter(x => x.c \u003c= x.i.reorderLevel).length} item(s) at or below reorder level.` };\n      { const G2 = groupByCat(D, x => x.i.category, (x, k) => [k, x.i.name, x.i.category, x.i.unit, x.r.opening, x.r.in, x.r.w, x.r.u, x.c, r2(x.c * x.i.costPerUnit)], { cols: o.cols, sums: [4, 5, 6, 7, 8, 9], label: 1 }); o.rows = G2.rows; o.csvRows = G2.data; o.foot = G2.foot; }\n    } else {\n      const D = monthData(UI.month), sum = f => r2(D.reduce((a, x) => a + f(x), 0));\n      o = { title: \"Monthly Stock Report\", subtitle: R.label,\n        summary: [[\"Ingredients\", D.length], [\"Stock In value\", money(sum(x => x.inV))], [\"Consumption value\", money(sum(x => x.uV))], [\"Wastage value\", money(sum(x => x.wV))], [\"Closing stock value\", money(sum(x => x.val))]],\n        cols: [{ l: \"#\", w: \"4%\", a: \"c\", nocsv: 1 }, { l: \"Ingredient\", w: \"24%\" }, { l: \"Category\", csv: 1 }, { l: \"Unit\", w: \"7%\" }, { l: \"Opening\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Stock In\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Wastage\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Consumed\", w: \"10%\", a: \"r\", t: \"n\" }, { l: \"Closing\", w: \"9%\", a: \"r\", t: \"b\" }, { l: \"Waste %\", w: \"8%\", a: \"r\", t: \"p\" }, { l: \"Value (₹)\", w: \"11%\", a: \"r\", t: \"m\" }, { l: \"Stock In (₹)\", csv: 1, t: \"m\" }, { l: \"Consumption (₹)\", csv: 1, t: \"m\" }, { l: \"Wastage (₹)\", csv: 1, t: \"m\" }],\n        rows: [],\n        foot: [],\n        note: \"Ingredients are grouped category-wise with a subtotal for each category and a grand total. Per row: Opening + Stock In − Wastage − Consumed = Closing. Waste % = wastage ÷ (wastage + consumed). Quantity totals add the numbers across units (kg, pcs, plate…); the Value (₹) total is the reliable figure. Values are at cost per unit in Indian Rupees (₹).\" };\n      { const post = r => { r[9] = r[6] + r[7] > 0 ? Math.round(r[6] / (r[6] + r[7]) * 1000) / 10 : 0; };\n        const G2 = groupByCat(D, x => x.i.category, (x, k) => [k, x.i.name, x.i.category, x.i.unit, x.opening, x.tin, x.tw, x.tu, x.closing, x.wp, x.val, x.inV, x.uV, x.wV], { cols: o.cols, sums: [4, 5, 6, 7, 8, 9, 10], label: 1, post }); o.rows = G2.rows; o.csvRows = G2.data; o.foot = G2.foot; }\n    }\n  } else {\n    const isIn = t === \"in\", name = isIn ? \"Stock In\" : \"Consumption\", E = gather(t, R.start, R.end), val = x => entryValue(t, x);\n    const total = r2(E.reduce((a, x) => a + val(x), 0)), ingSet = new Set(E.map(x => x.ing)), days = new Set(E.map(x => x.date)), sup = new Set(E.filter(x => x.supplier).map(x => x.supplier));\n    const g = {};\n    for (const x of E) { const e = g[x.ing] = g[x.ing] || { id: x.ing, n: 0, q: 0, v: 0, days: new Set(), last: \"\", sup: new Set() }; e.n++; e.q = r2(e.q + x.qty); e.v = r2(e.v + val(x)); e.days.add(x.date); if (x.date > e.last) e.last = x.date; if (x.supplier) e.sup.add(x.supplier); }\n    const G = Object.values(g).sort((a, b) => ingName(a.id).localeCompare(ingName(b.id)));\n    const top = G.slice().sort((a, b) => b.v - a.v)[0];\n    const note = `Quantities are shown in each ingredient's own unit and are not added across units. Value = ${isIn ? \"invoice cost when entered, otherwise quantity × cost per unit\" : \"quantity × cost per unit\"}, in Indian Rupees (₹). Rows marked “Daily log” were typed directly in the Daily Stock Log. Items are grouped category-wise with a subtotal per category and a grand total; quantity totals add numbers across units, so rely on the Value (₹) totals.`;\n    const summary = isIn ? [[\"Entries\", E.length], [\"Ingredients\", ingSet.size], [\"Suppliers\", sup.size], [\"Total value\", money(total)]]\n      : [[\"Entries\", E.length], [\"Ingredients\", ingSet.size], daily ? [\"Top item (value)\", top ? esc(ingName(top.id)) : \"–\"] : [\"Days with usage\", days.size], [\"Consumption value\", money(total)]];\n    o = { title: `${P} ${name} Report`, subtitle: R.label, summary, note };\n    if (daily || UI.rview === \"entries\") {\n      const withDate = !daily;\n      const lead = withDate ? [{ l: \"#\", w: \"4%\", a: \"c\", nocsv: 1 }, { l: \"Date\", w: \"11%\" }] : [{ l: \"#\", w: \"5%\", a: \"c\", nocsv: 1 }];\n      const mid = isIn\n        ? (withDate ? [{ l: \"Ingredient\", w: \"18%\" }, { l: \"Quantity\", w: \"8%\", a: \"r\", t: \"n\" }, { l: \"Unit\", w: \"6%\" }, { l: \"Supplier\", w: \"15%\" }, { l: \"Invoice\", w: \"11%\" }, { l: \"Value (₹)\", w: \"11%\", a: \"r\", t: \"m\" }, { l: \"Notes\", w: \"16%\" }]\n                    : [{ l: \"Ingredient\", w: \"20%\" }, { l: \"Quantity\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Unit\", w: \"7%\" }, { l: \"Supplier\", w: \"17%\" }, { l: \"Invoice\", w: \"12%\" }, { l: \"Value (₹)\", w: \"12%\", a: \"r\", t: \"m\" }, { l: \"Notes\", w: \"18%\" }])\n        : (withDate ? [{ l: \"Ingredient\", w: \"18%\" }, { l: \"Quantity\", w: \"8%\", a: \"r\", t: \"n\" }, { l: \"Unit\", w: \"6%\" }, { l: \"Used for\", w: \"12%\" }, { l: \"Staff\", w: \"12%\" }, { l: \"Value (₹)\", w: \"11%\", a: \"r\", t: \"m\" }, { l: \"Notes\", w: \"18%\" }]\n                    : [{ l: \"Ingredient\", w: \"22%\" }, { l: \"Quantity\", w: \"10%\", a: \"r\", t: \"n\" }, { l: \"Unit\", w: \"8%\" }, { l: \"Used for\", w: \"14%\" }, { l: \"Staff\", w: \"14%\" }, { l: \"Value (₹)\", w: \"12%\", a: \"r\", t: \"m\" }, { l: \"Notes\", w: \"15%\" }]);\n      o.cols = lead.concat(mid);\n      const qi = lead.length + 1, vi = lead.length + 5;\n      const G2 = groupByCat(E, x => catOf(x.ing), (x, k) => (withDate ? [k, x.date] : [k]).concat([ingName(x.ing), x.qty, ingUnit(x.ing)], isIn ? [x.supplier, x.invoice] : [x.usedFor, x.staff], [val(x), x.notes]), { cols: o.cols, sums: [qi, vi], label: lead.length });\n      o.rows = G2.rows; o.csvRows = G2.data; o.foot = G2.foot;\n    } else if (isIn) {\n      o.cols = [{ l: \"#\", w: \"5%\", a: \"c\", nocsv: 1 }, { l: \"Ingredient\", w: \"24%\" }, { l: \"Unit\", w: \"8%\" }, { l: \"Entries\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Total quantity\", w: \"13%\", a: \"r\", t: \"n\" }, { l: \"Last received\", w: \"13%\" }, { l: \"Suppliers\", w: \"16%\" }, { l: \"Value (₹)\", w: \"12%\", a: \"r\", t: \"m\" }];\n      const G2 = groupByCat(G, e => catOf(e.id), (e, k) => [k, ingName(e.id), ingUnit(e.id), e.n, e.q, e.last, Array.from(e.sup).slice(0, 3).join(\", \"), e.v], { cols: o.cols, sums: [3, 4, 7], label: 1 });\n      o.rows = G2.rows; o.csvRows = G2.data; o.foot = G2.foot;\n    } else {\n      o.cols = [{ l: \"#\", w: \"5%\", a: \"c\", nocsv: 1 }, { l: \"Ingredient\", w: \"26%\" }, { l: \"Unit\", w: \"8%\" }, { l: \"Entries\", w: \"9%\", a: \"r\", t: \"n\" }, { l: \"Total consumed\", w: \"14%\", a: \"r\", t: \"n\" }, { l: \"Days used\", w: \"10%\", a: \"r\", t: \"n\" }, { l: \"Avg / day used\", w: \"14%\", a: \"r\", t: \"n\" }, { l: \"Value (₹)\", w: \"14%\", a: \"r\", t: \"m\" }];\n      const G2 = groupByCat(G, e => catOf(e.id), (e, k) => [k, ingName(e.id), ingUnit(e.id), e.n, e.q, e.days.size, r2(e.q / e.days.size), e.v], { cols: o.cols, sums: [3, 4, 7], label: 1 });\n      o.rows = G2.rows; o.csvRows = G2.data; o.foot = G2.foot;\n      const u = {}; for (const x of E) { const b = u[x.usedFor || \"Other\"] = u[x.usedFor || \"Other\"] || { n: 0, v: 0 }; b.n++; b.v = r2(b.v + val(x)); }\n      const UL = Object.entries(u).sort((a, b) => b[1].v - a[1].v);\n      o.extra = extraTable(\"Consumption by usage type\", [{ l: \"Used for\", w: \"40%\" }, { l: \"Entries\", w: \"20%\", a: \"r\", t: \"n\" }, { l: \"Value (₹)\", w: \"25%\", a: \"r\", t: \"m\" }, { l: \"Share\", w: \"15%\", a: \"r\", t: \"p\" }], UL.map(([k, b]) => [k, b.n, b.v, total > 0 ? Math.round(b.v / total * 1000) / 10 : 0]));\n    }\n  }\n  o.fname = `chouka-guwahati-${t}-${P.toLowerCase()}-report-${R.key}.csv`;\n  o.csv = [o.cols.filter(c => !c.nocsv).map(c => c.l.replace(\"(₹)\", \"(INR)\")), ...(o.csvRows || o.rows).map(r => r.filter((_, j) => !o.cols[j].nocsv)), [], [\"Generated from Chouka Management Software\"]];\n  return o;\n}\nfunction reportControls(){\n  const chip = (a, v, l, on) => `\u003cspan class=\"chip ${on ? \"on\" : \"\"}\" data-a=\"${a}\" data-v=\"${v}\">${l}\u003c/span>`, daily = UI.period === \"daily\";\n  const when = daily\n    ? `\u003cbutton class=\"btn ic\" data-a=\"step\" data-n=\"-1\">‹\u003c/button>\u003cb>${fmtDate(UI.date)}\u003c/b>\u003cbutton class=\"btn ic\" data-a=\"step\" data-n=\"1\">›\u003c/button>\u003cbutton class=\"btn sm\" data-a=\"today\">Today\u003c/button>`\n    : `\u003cinput type=\"month\" id=\"gmonth\" value=\"${UI.month}\" style=\"width:auto\">` + [0, -1, -2].map(o => `\u003cbutton class=\"btn sm ${UI.month === monthOff(o) ? \"pri\" : \"\"}\" data-a=\"setmonth\" data-v=\"${monthOff(o)}\">${o === 0 ? \"This month\" : o === -1 ? \"Last month\" : \"2 mo ago\"}\u003c/button>`).join(\"\");\n  return `\u003cdiv class=\"card pad noprint\" style=\"margin-bottom:16px\">\n   \u003clabel style=\"margin-top:0\">Report\u003c/label>\u003cdiv class=\"chips\">${RT.map(([k, l]) => chip(\"rtype\", k, l, UI.rtype === k)).join(\"\")}\u003c/div>\n   \u003cdiv style=\"display:flex;flex-wrap:wrap;gap:6px 24px;align-items:flex-end;margin-top:6px\">\n    \u003cdiv>\u003clabel>Period\u003c/label>\u003cdiv class=\"chips\">${chip(\"rperiod\", \"daily\", \"Daily\", daily)}${chip(\"rperiod\", \"monthly\", \"Monthly\", !daily)}\u003c/div>\u003c/div>\n    \u003cdiv>\u003clabel>${daily ? \"Date\" : \"Month\"}\u003c/label>\u003cdiv style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px\">${when}\u003c/div>\u003c/div>\n    ${!daily && UI.rtype !== \"stock\" ? `\u003cdiv>\u003clabel>Show\u003c/label>\u003cdiv class=\"chips\">${chip(\"rview\", \"summary\", \"Ingredient summary\", UI.rview === \"summary\")}${chip(\"rview\", \"entries\", \"All entries\", UI.rview === \"entries\")}\u003c/div>\u003c/div>` : \"\"}\n    \u003cdiv>\u003clabel>Export page\u003c/label>\u003cdiv class=\"chips\">${chip(\"orient\", \"portrait\", \"A4 Portrait\", UI.orient === \"portrait\")}${chip(\"orient\", \"landscape\", \"A4 Landscape\", UI.orient === \"landscape\")}\u003c/div>\u003c/div>\n    \u003cdiv style=\"margin-left:auto;display:flex;gap:8px\">\u003cbutton class=\"btn\" data-a=\"csv\">⬇ CSV\u003c/button>\u003cbutton class=\"btn pri\" data-a=\"print\">🖨 Print / Save PDF\u003c/button>\u003c/div>\n   \u003c/div>\u003c/div>`;\n}\nviews.reports = () => S.ing.length ? reportControls() + sheet(reportModel()) : emptyState();\n\n/* ---- Backup ---- */\nviews.backup = () => `\u003cdiv class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(300px,1fr))\">\n  \u003cdiv class=\"card pad\">\u003ch3>Download backup\u003c/h3>\u003cp class=\"muted\">Saves all ingredients, logs and entries to a file. Do this regularly (for example every week) as an extra safety copy outside the cloud.\u003c/p>\u003cbutton class=\"btn pri\" data-a=\"backup\">⬇ Download backup (.json)\u003c/button>\u003c/div>\n  \u003cdiv class=\"card pad\">\u003ch3>Restore backup\u003c/h3>\u003cp class=\"muted\">Load a backup file. This \u003cb>replaces\u003c/b> everything currently in the cloud database. Use it to move data from the older single-browser version of the app.\u003c/p>\u003cinput type=\"file\" id=\"restore\" accept=\".json,application/json\">\u003c/div>\n  \u003cdiv class=\"card pad\">\u003ch3>Sample data\u003c/h3>\u003cp class=\"muted\">Adds 12 sample ingredients (only if the list is empty) so you can try the app.\u003c/p>\u003cbutton class=\"btn\" data-a=\"sample\">Load sample ingredients\u003c/button>\u003c/div>\n  \u003cdiv class=\"card pad\">\u003ch3>Erase everything\u003c/h3>\u003cp class=\"muted\">Deletes all data from the cloud database, for every device. Download a backup first.\u003c/p>\u003cbutton class=\"btn red\" data-a=\"reset\">Erase all data\u003c/button>\u003c/div>\n  \u003cdiv class=\"card pad\" style=\"grid-column:1/-1\">\u003cb>Good to know:\u003c/b>\u003cul class=\"muted\">\u003cli>All devices signed in with an allowed account see the same data, updated live.\u003c/li>\u003cli>The app keeps working if the internet drops; changes are sent to the cloud when it returns.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>`;\n\n/* =====================  ACTIONS  ===================== */\nfunction download(name, text, type){ const a = document.createElement(\"a\"); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }\nconst csvCell = v => { const s = String(v ?? \"\"); return /[\",\\n]/.test(s) ? `\"${s.replace(/\"/g, '\"\"')}\"` : s; };\nconst toCSV = rows => \"﻿\" + rows.map(r => r.map(csvCell).join(\",\")).join(\"\\n\");\nfunction sampleData(){\n  const L = [[\"Chicken Breast\",\"Meat & Seafood\",\"kg\",8,32,\"Fresh Farms Co.\",220,\"Walk-in Fridge\"],[\"Fresh Milk\",\"Dairy & Eggs\",\"liters\",10,45,\"DairyPure Ltd\",60,\"Walk-in Fridge\"],[\"Tomato\",\"Vegetables\",\"kg\",6,28,\"Green Valley\",40,\"Walk-in Fridge\"],[\"Basmati Rice\",\"Pantry\",\"kg\",15,80,\"Spice Route\",110,\"Open Storage\"],[\"Olive Oil\",\"Pantry\",\"liters\",5,22,\"Mediterraneo\",900,\"Open Storage\"],[\"Eggs\",\"Dairy & Eggs\",\"units\",12,60,\"DairyPure Ltd\",7,\"Walk-in Fridge\"],[\"Salmon Fillet\",\"Meat & Seafood\",\"kg\",4,14,\"Ocean Catch\",1400,\"Deep Fridge\"],[\"Flour\",\"Bakery\",\"kg\",10,55,\"Mill House\",45,\"Open Storage\"],[\"Cheddar Cheese\",\"Dairy & Eggs\",\"kg\",5,18,\"DairyPure Ltd\",650,\"Walk-in Fridge\"],[\"Potato\",\"Vegetables\",\"kg\",12,48,\"Green Valley\",30,\"Open Storage\"],[\"Butter\",\"Dairy & Eggs\",\"kg\",4,12,\"DairyPure Ltd\",550,\"Walk-in Fridge\"],[\"Avocado\",\"Vegetables\",\"units\",20,36,\"Green Valley\",120,\"Walk-in Fridge\"]];\n  for (const a of L) S.ing.push({ id: newId(), name: a[0], category: a[1], unit: a[2], reorderLevel: a[3], initialStock: a[4], supplier: a[5], costPerUnit: a[6], storage: a[7], notes: \"\" });\n}\nfunction addEntry(kind, f){\n  const id = Number(f.ing), qty = r2(f.qty), date = f.date;\n  if (!id || !(qty > 0) || !date) return toast(\"Ingredient, date and quantity > 0 are required\", true);\n  const map = { stockin: { in: qty }, consumption: { u: qty }, wastage: { w: qty } }[kind];\n  const err = applyDelta(id, date, map); if (err) return toast(err, true);\n  const nid = newId();\n  if (kind === \"stockin\") S.stockIn.push({ id: nid, ing: id, date, qty, supplier: f.supplier || \"\", invoice: f.invoice || \"\", cost: Number(f.cost) || 0, notes: f.notes || \"\" });\n  if (kind === \"consumption\") S.cons.push({ id: nid, ing: id, date, qty, usedFor: UI.usedFor, staff: f.staff || \"\", notes: f.notes || \"\" });\n  if (kind === \"wastage\") S.waste.push({ id: nid, ing: id, date, qty, reason: UI.reason, staff: f.staff || \"\", notes: f.notes || \"\" });\n  UI.entryDate = date; UI.pre = \"\"; save();\n  toast(`${{ stockin: \"Stock In\", consumption: \"Consumption\", wastage: \"Wastage\" }[kind]} saved — added to the Daily Stock Log for ${fmtDate(date)}`); render();\n}\nfunction delEntry(kind, id){\n  const arr = { stockin: S.stockIn, consumption: S.cons, wastage: S.waste }[kind], e = arr.find(x => x.id === id); if (!e) return;\n  if (!confirm(\"Delete this entry? Its quantity will also be removed from the Daily Stock Log.\")) return;\n  const err = applyDelta(e.ing, e.date, { stockin: { in: -e.qty }, consumption: { u: -e.qty }, wastage: { w: -e.qty } }[kind]);\n  if (err) return toast(\"Can't delete: \" + err, true);\n  arr.splice(arr.indexOf(e), 1); save(); toast(\"Entry deleted — Daily Stock Log updated\"); render();\n}\nfunction saveIng(f){\n  const name = (f.name || \"\").trim(); if (!name) return toast(\"Name is required\", true);\n  const n = k => Number(f[k]) || 0;\n  if ([n(\"reorderLevel\"), n(\"initialStock\"), n(\"costPerUnit\")].some(x => x \u003c 0)) return toast(\"Numbers can't be negative\", true);\n  const data = { name, category: f.category, unit: f.unit, reorderLevel: n(\"reorderLevel\"), initialStock: n(\"initialStock\"), supplier: f.supplier || \"\", costPerUnit: n(\"costPerUnit\"), storage: f.storage, notes: f.notes || \"\" };\n  if (UI.editIng) {\n    const i = ingById(UI.editIng), old = i.initialStock; i.initialStock = data.initialStock;\n    const bad = badDay(i.id, S.logs);\n    if (bad) { i.initialStock = old; return toast(`That initial stock would make closing negative on ${fmtDate(bad.date)}`, true); }\n    Object.assign(i, data);\n  } else S.ing.push(Object.assign({ id: newId() }, data));\n  toast(UI.editIng ? \"Ingredient updated\" : \"Ingredient added\"); UI.showIngForm = false; UI.editIng = null; save(); render();\n}\n\ndocument.addEventListener(\"click\", e => {\n  const t = e.target.closest(\"[data-a]\"); if (!t) return;\n  const a = t.dataset.a, v = t.dataset.v, id = Number(t.dataset.id);\n  switch (a) {\n    case \"nav\": UI.view = v; UI.showIngForm = false; UI.editIng = null; render(); window.scrollTo(0, 0); break;\n    case \"step\": UI.date = addDays(UI.date, Number(t.dataset.n)); render(); break;\n    case \"today\": UI.date = today(); render(); break;\n    case \"usedfor\": UI.usedFor = v; keepForm(); break;\n    case \"reason\": UI.reason = v; keepForm(); break;\n    case \"reorder\": UI.pre = String(id); UI.view = \"stockin\"; render(); break;\n    case \"savedaily\": saveDaily(); break;\n    case \"print\": applyPage(); window.print(); break;\n    case \"rtype\": UI.rtype = v; render(); break;\n    case \"rperiod\": UI.period = v; render(); break;\n    case \"rview\": UI.rview = v; render(); break;\n    case \"orient\": UI.orient = v; render(); break;\n    case \"csv\": { const M = reportModel(); download(M.fname, toCSV(M.csv), \"text/csv\"); break; }\n    case \"logout\": signOut(auth); break;\n    case \"setmonth\": UI.month = v; render(); break;\n    case \"addIng\": UI.editIng = null; UI.showIngForm = true; render(); break;\n    case \"editIng\": UI.editIng = id; UI.showIngForm = true; render(); window.scrollTo(0, 0); break;\n    case \"cancelIng\": UI.showIngForm = false; UI.editIng = null; render(); break;\n    case \"logToday\": UI.date = today(); UI.view = \"daily\"; render(); break;\n    case \"delIng\": { const i = ingById(id); if (confirm(`Delete ${i.name} and all its logs and entries?`)) { S.ing = S.ing.filter(x => x.id !== id); delete S.logs[id]; S.stockIn = S.stockIn.filter(x => x.ing !== id); S.cons = S.cons.filter(x => x.ing !== id); S.waste = S.waste.filter(x => x.ing !== id); save(); toast(\"Ingredient removed\"); render(); } break; }\n    case \"delentry\": delEntry(t.dataset.k, id); break;\n    case \"sample\": if (S.ing.length) toast(\"Sample data is only added when the ingredient list is empty\", true); else { sampleData(); save(); toast(\"12 sample ingredients added\"); UI.view = \"inventory\"; render(); } break;\n    case \"backup\": download(`chouka-guwahati-backup-${today()}.json`, JSON.stringify(S), \"application/json\"); break;\n    case \"reset\": if (confirm(\"Erase ALL data in the cloud for every device? This cannot be undone.\") && confirm(\"Really erase everything?\")) { S = blank(); save(); toast(\"All data erased\"); render(); } break;\n  }\n});\n/* chip clicks re-render but keep what was typed in the form */\nfunction keepForm(){\n  const f = document.querySelector(\"form[data-form]\"), vals = f ? Object.fromEntries(new FormData(f)) : {};\n  render(); const nf = document.querySelector(\"form[data-form]\");\n  if (nf) for (const [k, v] of Object.entries(vals)) { const el = nf.elements[k]; if (el) el.value = v; }\n}\ndocument.addEventListener(\"submit\", e => {\n  const f = e.target.closest(\"form[data-form]\"); if (!f) return; e.preventDefault();\n  const kind = f.dataset.form, data = Object.fromEntries(new FormData(f));\n  if (kind === \"login\") return doLogin(data);\n  if (kind === \"ing\") return saveIng(data);\n  if (!data.ing) { const i = resolveIng(data.ingname); if (!i) return toast(\"Please pick an ingredient from the list\", true); data.ing = i.id; }\n  addEntry(kind, data);\n});\ndocument.addEventListener(\"input\", e => {\n  const t = e.target;\n  if (t.dataset.dl) { UI.dirty = true; const d = UI.draft[t.dataset.id]; d[t.dataset.dl] = Number(t.value) || 0; dlUpdate(t.dataset.id); }\n  if (t.name === \"ingname\" && t.form) {\n    const i = resolveIng(t.value); t.form.elements.ing.value = i ? i.id : \"\";\n    if (i && t.form.dataset.form === \"stockin\" && t.form.elements.supplier) t.form.elements.supplier.value = i.supplier;\n  }\n  if (t.id === \"isearch\" || t.id === \"icat\") {\n    const q = $(\"#isearch\").value.toLowerCase(), c = $(\"#icat\").value;\n    document.querySelectorAll(\"#icards [data-name]\").forEach(el => { el.style.display = (c === \"All\" || el.dataset.cat === c) && el.dataset.name.includes(q) ? \"\" : \"none\"; });\n  }\n});\ndocument.addEventListener(\"change\", e => {\n  const t = e.target;\n  if (t.id === \"gdate\" && t.value) { UI.date = t.value; render(); }\n  if (t.id === \"gmonth\" && t.value) { UI.month = t.value; render(); }\n  if (t.id === \"restore\" && t.files[0]) {\n    const rd = new FileReader();\n    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!Array.isArray(o.ing) || typeof o.logs !== \"object\") throw 0; if (!confirm(\"Replace ALL current data with this backup?\")) return; S = Object.assign(blank(), o); S.ing = S.ing.map(fixIng); save(); toast(\"Backup restored\"); UI.view = \"dashboard\"; render(); } catch(x){ toast(\"That file is not a valid backup\", true); } };\n    rd.readAsText(t.files[0]);\n  }\n});\nwindow.addEventListener(\"online\", setStat); window.addEventListener(\"offline\", setStat);\nonAuthStateChanged(auth, u => {\n  authReady = true; user = u; stopSync(); S = blank(); ready = false; shadow = new Map(); UI.fatal = \"\";\n  if (u) startSync();\n  render();\n});\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>
<script type="application/json" id="d-cash">"\u003c!doctype html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>CHOUKA GUWAHATI — Daily Cash Closing Report\u003c/title>\n\u003cstyle>\n:root{--g1:#F3D98B;--g2:#F9EBC4;--g3:#FFFBF0;--ink:#3a2a0d;--mut:#6b5a35;--line:rgba(217,170,60,.4);--pri:#b45309;--pri2:#92400e;--red:#b91c1c;--grn:#047857}\n*{box-sizing:border-box}\nhtml,body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,\"Segoe UI\",Roboto,Arial,\"Noto Sans Bengali\",sans-serif;color:var(--ink);font-size:14px}\nbody{background:linear-gradient(90deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%) fixed;min-height:100vh}\n.shell{display:flex;min-height:100vh}\naside{width:250px;flex-shrink:0;background:linear-gradient(90deg,#E8C566,#F1D585);border-right:1px solid rgba(180,130,20,.4);position:fixed;left:0;top:0;bottom:0;z-index:30;display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto}\n.brand{display:flex;gap:10px;align-items:center;padding:6px 6px 16px}\n.brand small{display:block;letter-spacing:.32em;font-weight:700;font-size:10px;color:#78350f}\n.logoimg{display:block;width:100%;height:auto;background:rgba(255,255,255,.75);border-radius:12px;padding:8px 10px}\nnav{display:flex;flex-direction:column;gap:4px;flex:1}\nnav button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-weight:600;font-size:13px;color:#451a03}\nnav button:hover{background:rgba(255,255,255,.5)}\nnav button.on{background:#78350f;color:#fffbeb}\nnav button:focus-visible,.btn:focus-visible{outline:2px solid var(--pri2);outline-offset:2px}\n.stat{font-size:11px;font-weight:700;color:#78350f;margin-top:10px;padding:0 4px}\n.sync{background:rgba(255,255,255,.5);border:1px solid rgba(180,130,20,.4);border-radius:14px;padding:12px;font-size:12px;line-height:1.5;margin-top:10px}\n.sync b.t{display:block;font-size:10px;letter-spacing:.08em;color:#78350f;margin-bottom:4px}\n.sync code{display:block;margin-top:6px;background:rgba(120,53,15,.1);padding:4px 6px;border-radius:8px;font-size:10px}\nmain{flex:1;min-width:0;margin-left:250px}\nheader.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,rgba(243,217,139,.94),rgba(249,235,196,.94) 45%,rgba(255,251,240,.94));backdrop-filter:blur(6px);border-bottom:1px solid rgba(217,170,60,.5);padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}\nheader.top .ttl{margin-right:auto}\nheader.top small.b{display:block;font-size:10px;font-weight:900;letter-spacing:.25em;color:#92400e}\nheader.top h1{margin:0;font-size:20px;font-weight:900}\nheader.top p{margin:2px 0 0;font-size:12px;color:var(--mut)}\n.content{padding:24px;max-width:1100px;margin:0 auto}\n.btn{cursor:pointer;border:1px solid #e3b84f;background:rgba(255,255,255,.8);color:var(--ink);padding:9px 14px;border-radius:12px;font-weight:700;font-size:13px;font-family:inherit}\n.btn:hover{background:#fff3c4}.btn.red{background:var(--red);border-color:var(--red);color:#fff}\n.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}\ninput{font-family:inherit;font-size:14px;color:var(--ink);border:1px solid #e3c36f;background:rgba(255,255,255,.92);border-radius:9px;padding:8px 10px;width:100%;outline:none}\ninput:focus{box-shadow:0 0 0 2px #d97706}\ninput[type=number]{text-align:right;-moz-appearance:textfield}\ninput[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}\nlabel{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--mut);margin-top:10px;text-transform:uppercase}\n.muted{color:var(--mut);font-size:12px}\n.empty{padding:30px;text-align:center;color:var(--mut)}\n.rpt{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:16px;padding:18px}\n.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid #d97706;padding-bottom:10px;flex-wrap:wrap}\n.sheet-logo{display:block;height:46px;width:auto}\n.sheet-brand{font-size:11px;font-weight:900;letter-spacing:.32em;color:#8a5a00;line-height:1.1;margin-top:3px}\n.sheet-title{font-size:17px;font-weight:800}\n.sheet-sub{font-size:14px;font-weight:700;text-align:right;margin-top:4px}\n.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}\n.sum5{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}\n.sc{border:1px solid #e3c36f;background:#fff8e1;border-radius:10px;padding:8px 12px}\n.sc small{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.sc b{font-size:16px;font-weight:800}\n.sheet-sec{margin-top:18px}.sheet-h{font-weight:800;font-size:13px;color:#8a5a00;margin-bottom:6px}\n.sheet-scroll{overflow-x:auto}\n.sheet-table{width:100%;border-collapse:collapse;font-size:13px}\n.sheet-table th{background:#f3d98b;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.03em;padding:9px 10px;border:1px solid #cfa443;white-space:nowrap}\n.sheet-table td{padding:6px 10px;border:1px solid #e6d29a}\n.sheet-table tbody tr:nth-child(even){background:#fffaf0}\n.sheet-table tfoot td{background:#f3d98b;font-weight:800;border:1px solid #cfa443}\n.sheet-table .r,.sheet-table th.r{text-align:right}\n.sheet-table tr.cat-s td{background:#fbe8b0;font-weight:800}\n.sheet-table td.in1{width:150px}.sheet-table td.in2{width:90px}.sheet-table td.x{width:44px;text-align:center}\n.lr,.lb,.lm{color:#3a2a0d;font-weight:700}.ind{padding-left:22px}\n.v{font-variant-numeric:tabular-nums;font-weight:700}.v.g{color:var(--grn)}\n.ok{color:var(--grn)}.bad{color:var(--red)}.warn{color:var(--pri)}\n.sheet-note{font-size:11px;color:var(--mut);margin-top:10px}\n.gen-foot{margin-top:14px;text-align:center;font-size:11px;color:var(--mut);letter-spacing:.02em}\n@media screen and (min-width:1100px){\n  .content{max-width:none!important;width:100%}\n  #v-rep{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;align-items:start}\n  #v-rep>.sh-top,#v-rep>.lockbar,#v-rep>#lockbar,#v-rep>.f3,#v-rep>.sum5,#v-rep>.gen-foot,#v-rep>.sheet-sec:has([data-sig]),#v-rep>.sheet-sec:has(#b_du){grid-column:1/-1}\n  #v-rep>.sheet-sec{min-width:0}\n}\n@media print{\n  @page{size:A4;margin:7mm}\n  html,body{background:#fff!important;font-size:9px}\n  aside,header.top,.noprint,.x,.toast,tr.emp{display:none!important}\n  main{margin-left:0!important}.content{padding:0!important;max-width:none!important}\n  .rpt{background:#fff!important;border:0!important;border-radius:0!important;padding:0!important}\n  .sheet-scroll{overflow:visible!important}\n  input{border:0!important;background:transparent!important;padding:0!important;box-shadow:none!important;font-size:9px!important;height:auto!important;min-height:0!important}\n  .sheet-table{font-size:9px;line-height:1.15}.sheet-table td{padding:1px 5px}.sheet-table th{padding:2px 5px;font-size:8px}\n  .sheet-logo{height:30px}.sh-top{padding-bottom:4px}.sheet-title{font-size:13px}.sheet-sub{font-size:11px;margin-top:2px}\n  .f3{gap:6px;margin-top:2px}.f3 label{font-size:8px;margin:0}\n  .sum5{margin:6px 0;gap:6px}.sc{padding:3px 8px}.sc b{font-size:12px}.sc small{font-size:8px}\n  .sheet-sec{margin-top:3mm;break-inside:avoid}.sheet-h{font-size:10px;margin-bottom:2px}\n  .gen-foot{margin-top:6px;font-size:8px}\n  #v-rep{display:grid!important;grid-template-columns:1fr 1fr;column-gap:4mm;align-items:start}\n  #v-rep>.sh-top,#v-rep>.f3,#v-rep>.sum5,#v-rep>.gen-foot,#v-rep>.sheet-sec:has([data-sig]),#v-rep>.sheet-sec:has(#b_du){grid-column:1/-1}\n  #v-rep>.sheet-sec{min-width:0}\n  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n}\n@media(max-width:900px){\n  .shell{flex-direction:column}\n  aside{width:auto;position:static;flex-direction:row;padding:8px;overflow-x:auto;align-items:center}\n  main{margin-left:0}\n  .brand{padding:0 8
