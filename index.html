function calc(e){
  const a=S.att[e.id+'|'+M+'|c']||{};let c={P:0,A:0,H:0,HL:0,L:0,W:0};
  for(let d=1;d<=dim();d++){const v=a[d];if(v)c[v]++}
  const marked=c.P+c.A+c.H+c.HL+c.L+c.W,days=dim();
  const unpaid=c.A+.5*c.H+(days-marked);
  const payable=marked===0?0:Math.max(0,30-unpaid);
  const gross=Math.round(e.salary/30*payable);
  const ax=S.exp.filter(x=>x.emp===e.id&&inCyc(x.date)&&x.status==='Approved');
  const trv=ax.reduce((s,x)=>s+x.amt,0);
  const dls=S.ded.filter(x=>x.emp===e.id&&inCyc(x.date)),dby={};
  Object.keys(DT).forEach(k=>dby[k]=0);
  dls.forEach(x=>{dby[x.type]=(dby[x.type]||0)+dedAmt(x,e)});
  const ded=dls.reduce((s,x)=>s+dedAmt(x,e),0);
  const arr=S.arr.filter(x=>x.emp===e.id&&inCyc(x.date)).reduce((s,x)=>s+x.amt,0);
  return{...c,unmarked:days-marked,payable,gross,arr,trv,ded,dby,km:Math.round(ax.reduce((s,x)=>s+(x.km||0),0)*100)/100,late:dls.filter(x=>x.type==='Late check-in').length,net:gross+arr+trv-ded};
}

function importExp(file){
  if(!window.XLSX){toast('Excel library failed to load. Reload the page and try again.');return}
  const r=new FileReader();
  r.onload=()=>{try{
    const wb=XLSX.read(r.result,{type:'array',cellDates:true});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:true});
    const norm=s=>String(s).toLowerCase().replace(/[^a-z]/g,'');
    const pick=(o,...ks)=>{for(const k of Object.keys(o)){if(ks.includes(norm(k)))return o[k]}return ''};
    const toISO=v=>{if(v instanceof Date)return isNaN(v)?'':iso(new Date(v.getTime()+432e5));
      const s=String(v).trim();if(!s)return'';let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
      m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
      const t=new Date(s);return isNaN(t)?'':iso(t)};
    let ok=0,inC=0,badDate=0,zero=0;const miss=new Set();
    rows.forEach(o=>{
      const rawN=String(pick(o,'employee','employeename','name','empname')).trim(),en=rawN.toLowerCase(),ec=String(pick(o,'code','employeecode','empcode')).trim().toLowerCase();
      const e=S.emps.find(x=>x.name.trim().toLowerCase()===en||(ec&&(x.code||'').trim().toLowerCase()===ec)||(en&&(x.code||'').trim().toLowerCase()===en));
      if(!e){miss.add(rawN||'(blank name)');return}
      const d=toISO(pick(o,'date','traveldate'));if(!d){badDate++;return}
      const km=parseFloat(pick(o,'km','kms','kilometers','kilometres','distance','kmtravelled','kmtraveled'))||0;
      let a=parseFloat(pick(o,'amount','amt','total'));if(!(a>=0))a=Math.round(km*S.rate*100)/100;
      if(!(a>0)){zero++;return}
      S.exp.push({id:uid(),emp:e.id,date:d,from:String(pick(o,'from')).trim(),to:String(pick(o,'to')).trim(),mode:String(pick(o,'mode')).trim()||'Bike',purpose:String(pick(o,'purpose','remarks','note')).trim(),km,amt:a,status:String(pick(o,'status')).toLowerCase().startsWith('appr')?'Approved':'Pending'});
      ok++;if(inCyc(d))inC++});
    IMP={ok,outside:ok-inC,badDate,zero,miss:[...miss],file:file.name};
    save();render();
    toast('Imported '+ok+' expense'+(ok==1?'':'s'));
  }catch(err){toast('Import failed: '+err.message)}};
  r.readAsArrayBuffer(file);
}

function slipPdf(list){try{

  const cs2={0:{cellWidth:'auto'},1:{cellWidth:'wrap',halign:'right'}};
  const cut=(t,w)=>{t=String(t);if(doc.getTextWidth(t)<=w)return t;while(t.length>1&&doc.getTextWidth(t+'...')>w)t=t.slice(0,-1);return t+'...'};
  list.forEach((e,i)=>{
    if(i)doc.addPage();const c=calc(e);
    doc.setFillColor(...C.bg);doc.rect(0,0,W,30,'F');doc.setFillColor(...C.acc);doc.rect(0,30,W,1.2,'F');
    brand(doc,15,14);

    // employee details
    doc.setFillColor(...C.soft);doc.roundedRect(15,42,W-30,42,2,2,'F');
    const fld=(l,v,x,y,w)=>{doc.setFont('courier','normal');doc.setFontSize(6.8);doc.setTextColor(...C.mute);doc.text(l.toUpperCase(),x,y);doc.setFont('courier','bold');doc.setFontSize(9);doc.setTextColor(...C.ink);doc.text(cut(v||'-',w),x,y+5)};
    const cx=[20,66,112,158];

    // attendance strip

      doc.setFont('courier','bold');doc.setFontSize(12);doc.setTextColor(...(hi?[255,255,255]:C.ink));doc.text(String(v),x+2,105.5)});
    // earnings and deductions side by side
    doc.autoTable({startY:116,head:[['Earnings','INR']],body:[['Salary earned',fN(c.gross)],['Arrear',fN(c.arr)],['Travel'+(c.km?' ('+c.km+' km at INR '+S.rate+')':''),fN(c.trv)]],foot:[['Total earnings',fN(c.gross+c.arr+c.trv)]],theme:'plain',styles:st,headStyles:th,footStyles:ft,margin:{left:15,right:W/2+3},columnStyles:cs2});
    const y1=doc.lastAutoTable.finalY;
    doc.autoTable({startY:116,head:[['Deductions','INR']],body:K.map(k=>[k==='Late check-in'?'Late check-in ('+c.late+')':k,fN(c.dby[k])]),foot:[['Total deductions',fN(c.ded)]],theme:'plain',styles:st,headStyles:th,footStyles:ft,margin:{left:W/2+3,right:15},columnStyles:cs2});
    const y3=Math.max(y1,doc.lastAutoTable.finalY)+12;
    doc.setFillColor(...C.acc);doc.roundedRect(15,y3,W-30,16,2,2,'F');
    doc.setFont('courier','bold');doc.setFontSize(9);doc.setTextColor(204,244,238);doc.text('NET PAY',21,y3+9.8);
    doc.setFontSize(16);doc.setTextColor(255,255,255);doc.text('INR '+fN(c.net),W-21,y3+10.5,{align:'right'});
    doc.setFont('courier','normal');doc.setFontSize(7.5);doc.setTextColor(...C.mute);
    doc.text('Salary earned = Salary / 30 x payable days. Net pay = Salary earned + Arrear + approved Travel - Deductions.',15,y3+24,{maxWidth:W-30});
    doc.setTextColor(...C.ink);doc.setDrawColor(...C.ink);doc.setLineWidth(.3);
    doc.line(15,268,75,268);doc.text('Employee signature',15,273);doc.line(W-75,268,W-15,268);doc.text('Authorised signatory',W-75,273);
  });
  dl('salary-slip-'+(list.length===1?list[0].name.replace(/\s+/g,'-'):'all')+'-'+M+'.pdf','application/pdf',doc.output('arraybuffer'));
}catch(err){toast('PDF error: '+err.message)}}

function rArr(){
  if(!S.emps.length){$('#view').innerHTML=none();return}
  const list=S.arr.filter(x=>inCyc(x.date)).sort((a,b)=>a.date<b.date?-1:1);
  const tot=list.reduce((s,x)=>s+x.amt,0);
  $('#view').innerHTML=`<div class="card"><h2 class="ct">Add arrear</h2><div class="row"><label>Employee<select id="ae">${opts()}</select></label><label>Date<input type="date" id="ad" value="${cs()}"></label><label class="wide">Reason<input id="an" placeholder="e.g. Salary arrear"></label><label>Amount (₹)<input id="aa" type="number" min="0"></label><button class="btn" id="addA">Add arrear</button></div><div class="note">Arrears are added to the employee’s earnings for the cycle that contains the entry date.</div></div>
  <div class="card fit sc">${list.length?`<table><thead><tr><th>Date</th><th>Employee</th><th>Reason</th><th class="n">Amount</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td title="${x.date}">${sd(x.date)}</td><td>${esc(ename(x.emp))}</td><td>${esc(x.note)||'–'}</td><td class="n">${inr(x.amt)}</td><td><button class="btn d" data-da="${x.id}">Delete</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="3">Total arrears</td><td class="n">${inr(tot)}</td><td></td></tr></tfoot></table>`:'<div class="empty">No arrears this cycle.</div>'}</div>`;
  $('#addA').onclick=()=>{const a=parseFloat($('#aa').value),d=$('#ad').value;if(!(a>0)||!d)return;S.arr.push({id:uid(),emp:$('#ae').value,date:d,note:$('#an').value.trim(),amt:a});save();render()};
}

function rDed(){
  if(!S.emps.length){$('#view').innerHTML=none();return}
  const em=id=>S.emps.find(e=>e.id===id);
  const list=S.ded.filter(x=>inCyc(x.date)).sort((a,b)=>a.date<b.date?-1:1);
  const amt=x=>em(x.emp)?dedAmt(x,em(x.emp)):0;
  const tot=list.reduce((s,x)=>s+amt(x),0);
  $('#view').innerHTML=`<div class="card"><h2 class="ct">Add deduction</h2><div class="row">
  <label>Employee<select id="de">${opts()}</select></label><label>Date<input type="date" id="dd" value="${cs()}"></label>
  <label>Type<select id="dt">${Object.keys(DT).map(k=>`<option>${k}</option>`).join('')}</select></label>
  <label>Deduct as<select id="db"><option value="days">Days of salary</option><option value="amt">Fixed amount (₹)</option></select></label>
  <label>Value<input id="dv" type="number" min="0" step="any"></label>
  <label class="wide">Note<input id="dn"></label>
  <button class="btn" id="addD">Add deduction</button></div>
  <div class="note">Late check-in and Penalty default to 0.5 day of salary (daily rate = salary ÷ 30). Insurance and Advance/EMI are fixed amounts. You can change the basis or value for any entry.</div></div>
  <div class="card fit sc">${list.length?`<table><thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Basis</th><th>Note</th><th class="n">Amount</th><th></th></tr></thead><tbody>${list.map(x=>`<tr><td title="${x.date}">${sd(x.date)}</td><td>${esc(ename(x.emp))}</td><td>${esc(x.type)}</td><td>${x.basis==='days'?x.val+' day(s)':'Fixed'}</td><td>${esc(x.note)||'–'}</td><td class="n">${inr(amt(x))}</td><td><button class="btn d" data-dd="${x.id}">Delete</button></td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5">Total deductions</td><td class="n">${inr(tot)}</td><td></td></tr></tfoot></table>`:'<div class="empty">No deductions this cycle.</div>'}</div>`;
  const set=()=>{const d=DT[$('#dt').value];$('#db').value=d[0];$('#dv').value=d[1]};
  $('#dt').onchange=set;set();
  $('#addD').onclick=()=>{const v=parseFloat($('#dv').value),d=$('#dd').value;if(!(v>0)||!d)return;
    S.ded.push({id:uid(),emp:$('#de').value,date:d,type:$('#dt').value,basis:$('#db').value,val:v,note:$('#dn').value.trim()});save();render()};
}

function rPay(){
  const R=sorted().map(e=>({e,c:calc(e)}));
  const K=Object.keys(DT);
  const T=R.reduce((t,{c})=>({g:t.g+c.gross,x:t.x+c.trv,d:t.d+c.ded,n:t.n+c.net,a:t.a+c.arr,k:t.k+c.km,l:t.l+c.late}),{g:0,x:0,d:0,n:0,a:0,k:0,l:0});
  T.k=Math.round(T.k*100)/100;
  const kt=k=>R.reduce((s,{c})=>s+c.dby[k],0);
  $('#view').innerHTML=`<div class="kpis"><div class="kpi"><span>Employees</span><b>${R.length}</b></div><div class="kpi"><span>Gross pay</span><b>${inr(T.g)}</b></div><div class="kpi"><span>Travel (${T.k} km)</span><b>${inr(T.x)}</b></div><div class="kpi"><span>Deductions</span><b>${inr(T.d)}</b></div><div class="kpi hi"><span>Net payable</span><b>${inr(T.n)}</b></div></div>
  <div class="card"><div class="toolbar"><button class="btn" id="pdf">Export PDF</button><button class="btn" id="xls">Export Excel</button><button class="btn s" id="csv">Export CSV</button><button class="btn s" id="bak">Export backup</button><label class="btn s">Import backup<input type="file" id="imp" accept=".json"></label></div></div>
  <div class="card sc pay">${R.length?`<table><thead><tr><th>Employee</th><th class="n">Salary</th><th class="n">P</th><th class="n">H</th><th class="n">HL</th><th class="n">L</th><th class="n">W</th><th class="n">A</th><th class="n">Late</th><th class="n">Payable<br>days</th><th class="n">Gross<br>pay</th><th class="n">Arrear</th><th class="n">Travel<br>km</th><th class="n">Travel</th>${K.map(k=>`<th class="n">${KL[k]||k}</th>`).join('')}<th class="n">Total<br>ded.</th><th class="n">Net<br>pay</th></tr></thead><tbody>${R.map(({e,c})=>`<tr><td class="name">${esc(e.name)}</td><td class="n">${inr(e.salary)}</td><td class="n">${c.P}</td><td class="n">${c.H}</td><td class="n">${c.HL}</td><td class="n">${c.L}</td><td class="n">${c.W}</td><td class="n">${c.A}</td><td class="n">${c.late||'–'}</td><td class="n">${c.payable}</td><td class="n">${inr(c.gross)}</td><td class="n">${c.arr?inr(c.arr):'–'}</td><td class="n">${c.km||'–'}</td><td class="n">${inr(c.trv)}</td>${K.map(k=>`<td class="n">${c.dby[k]?inr(c.dby[k]):'–'}</td>`).join('')}<td class="n">${inr(c.ded)}</td><td class="n net">${inr(c.net)}</td></tr>`).join('')}</tbody><tfoot><tr><td>Total</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td class="n">${T.l}</td><td></td><td class="n">${inr(T.g)}</td><td class="n">${inr(T.a)}</td><td class="n">${T.k}</td><td class="n">${inr(T.x)}</td>${K.map(k=>`<td class="n">${inr(kt(k))}</td>`).join('')}<td class="n">${inr(T.d)}</td><td class="n">${inr(T.n)}</td></tr></tfoot></table>`:'<div class="empty">Add employees and attendance to see the summary.</div>'}
  <div class="note" style="margin-top:12px">P present · H half day · HL half-day leave (paid) · L paid leave · W weekly off · A absent. Employees are listed A to Z.</div></div>
  <div class="card"><label>Notes for ${monthLabel()} (included in the PDF)<textarea data-gnote rows="3" placeholder="Type any manual note for this month’s payroll…">${esc(S.notes['ALL|'+M]||'')}</textarea></label>
  <details class="how"><summary>How pay is calculated</summary><p>Attendance cycle: 15th of the selected month to the 16th of the next month. Salary is always based on 30 days: daily rate = monthly salary ÷ 30. Payable days = 30 − unpaid days, where unpaid days = Absent + ½ Half day + Unmarked days. So a full-attendance month (28, 30 or 31 days) always earns the full salary. Gross pay = daily rate × payable days. Net pay = Gross + arrears + approved travel expenses − deductions. Travel is claimed at ₹${S.rate} per km unless an amount is entered. Half-day leave (HL) is paid, so nothing is deducted for it. A month with nothing marked pays 0.</p></details></div>`;
  const hdr=['Employee','Salary','Present','Half day','Half-day leave','Paid leave','Weekly off','Absent','Late check-ins','Payable days','Gross pay','Arrear','Travel km','Travel',...K,'Total deductions','Net pay'];
  const body=R.map(({e,c})=>[e.name,e.salary,c.P,c.H,c.HL,c.L,c.W,c.A,c.late,c.payable,c.gross,c.arr,c.km,c.trv,...K.map(k=>c.dby[k]),c.ded,c.net]);
  $('#csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
    dl('payroll-'+M+'.csv','text/csv','﻿'+[hdr,...body].map(r=>r.map(q).join(',')).join('\n'))};
  $('#xls').onclick=()=>{
    if(!window.XLSX){toast('Excel library failed to load. Reload the page and try again.');return}
    if(!R.length){toast('Nothing to export yet');return}
    const tot=['Total','','','','','','','',T.l,'',T.g,T.a,T.k,T.x,...K.map(kt),T.d,T.n];
    const aoa=[hdr,...body,tot];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=fit(aoa);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Payroll');
    dl('payroll-'+M+'.xlsx','application/octet-stream',XLSX.write(wb,{type:'array',bookType:'xlsx'}))};
  $('#pdf').onclick=()=>payPdf(R,T,K);
  $('#bak').onclick=()=>dl('attendance-backup.json','application/json',JSON.stringify(S));
  $('#imp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.emps&&d.att&&d.exp){S=d;S.ded=S.ded||[];S.arr=S.arr||[];S.notes=S.notes||{};S.rate=S.rate||4;save();render();toast('Backup imported')}else toast('That file is not a payroll backup')}catch(e){toast('That file is not a payroll backup')}};r.readAsText(f);ev.target.value=''};
}
function payPdf(R,T,K){try{
  const J=window.jspdf;if(!J){toast('PDF library failed to load. Reload the page and try again.');return}
  const doc=new J.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  doc.setFillColor(...C.bg);doc.rect(0,0,W,26,'F');doc.setFillColor(...C.acc);doc.rect(0,26,W,1.2,'F');
  brand(doc,10,12);
  doc.setFont('courier','normal');doc.setFontSize(8);doc.setTextColor(...C.mute);
  doc.text('PAYROLL SUMMARY  |  AMOUNTS IN INR  |  SALARY BASIS 30 DAYS  |  TRAVEL INR '+S.rate+' PER KM',10,20);
  doc.setFont('courier','bold');doc.setFontSize(9);doc.setTextColor(...C.ink);doc.text(monthLabel(),W-10,12,{align:'right'});
  const head=[['Employee','Salary','P','H','HL','L','W','A','Late','Payable\ndays','Gross\npay','Arrear','Travel\nkm','Travel',...K.map(k=>(KL[k]||k).replace('<br>','\n')),'Total\nded.','Net\npay']];
  const body=R.map(({e,c})=>[e.name,fN(e.salary),c.P,c.H,c.HL,c.L,c.W,c.A,c.late,c.payable,fN(c.gross),fN(c.arr),c.km||'-',fN(c.trv),...K.map(k=>c.dby[k]?fN(c.dby[k]):'-'),fN(c.ded),fN(c.net)]);
  const foot=[['Total','','','','','','','',T.l,'',fN(T.g),fN(T.a),T.k,fN(T.x),...K.map(k=>fN(R.reduce((s,{c})=>s+c.dby[k],0))),fN(T.d),fN(T.n)]];
  const last=head[0].length-1;
  doc.autoTable({head,body,foot,startY:34,theme:'plain',margin:{left:10,right:10,bottom:24},showFoot:'lastPage',
    styles:{font:'courier',fontSize:7,cellPadding:{top:2.2,bottom:2.2,left:1.8,right:1.8},textColor:C.ink,lineColor:C.line,lineWidth:{bottom:.2},cellWidth:'wrap',valign:'middle'},
    headStyles:{fillColor:C.bg,textColor:C.mute,fontStyle:'bold',fontSize:6.5,lineColor:C.line,lineWidth:{bottom:.3}},
    footStyles:{fillColor:C.soft,textColor:C.ink,fontStyle:'bold'},
    alternateRowStyles:{fillColor:C.soft},
    columnStyles:{0:{cellWidth:'auto',fontStyle:'bold',halign:'left'}},
    didParseCell:h=>{const i=h.column.index;
      if(i>0)h.cell.styles.halign=h.section==='head'?'center':'right';
      if(i===last&&h.section!=='head'){h.cell.styles.fontStyle='bold';if(h.section==='body')h.cell.styles.fillColor=C.accSoft}}});
  let y=doc.lastAutoTable.finalY+7;const gn=(S.notes['ALL|'+M]||'').trim();
  if(y>H-46){doc.addPage();y=20}
  if(gn){doc.setFont('courier','bold');doc.setFontSize(8);doc.setTextColor(...C.ink);doc.text('Notes',10,y);doc.setFont('courier','normal');const ls=doc.splitTextToSize(gn,W-20);doc.text(ls,10,y+4.5);y+=7+ls.length*3.6}
  doc.setFont('courier','normal');doc.setFontSize(7);doc.setTextColor(...C.mute);
  doc.text('Gross pay = Salary / 30 x payable days. Net pay = Gross + Arrear + approved Travel - Deductions. P present, H half day, HL half-day leave (paid), L paid leave, W weekly off, A absent. Employees listed A to Z.',10,y,{maxWidth:W-20});
  doc.setDrawColor(...C.ink);doc.setLineWidth(.3);doc.setTextColor(...C.ink);
  doc.line(10,H-22,70,H-22);doc.text('Prepared by',10,H-18);
  doc.line(W-70,H-22,W-10,H-22);doc.text('Approved by',W-70,H-18);
  const n=doc.getNumberOfPages();
  for(let p=1;p<=n;p++){doc.setPage(p);doc.setFontSize(7);doc.setTextColor(...C.mute);doc.text(CO+'  |  Payroll '+monthLabel(),10,H-7);doc.text('Page '+p+' of '+n,W-10,H-7,{align:'right'})}
  dl('payroll-'+M+'.pdf','application/pdf',doc.output('arraybuffer'));
}catch(err){toast('PDF error: '+err.message)}}

function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none'},5000)}
async function dl(name,type,data){
  try{
    const d=window.claude?await claude.use('downloads'):null;
    if(d){await d.save({filename:name,data});toast('Saved '+name);return}
  }catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return}toast('Save failed ('+((e&&(e.code||e.message))||e)+'). Trying a direct download.')}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloading '+name)}catch(e){toast('Export is not available in this view')}
}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;EDIT=null;closeMenu();return render()}
  if(t.dataset.edit){EDIT=t.dataset.edit;render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}return}
  if(t.dataset.x==='imp'){IMP=null;return render()}
  if(t.dataset.x==='appall'){S.exp.forEach(x=>{if(inCyc(x.date)&&x.status!=='Approved')x.status='Approved'});save();return render()}
  if(t.dataset.del){
    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Confirm delete';clearTimeout(t._t);t._t=setTimeout(()=>{t.dataset.arm='';t.textContent='Delete'},3500);return}
    const id=t.dataset.del;S.emps=S.emps.filter(e=>e.id!==id);S.exp=S.exp.filter(x=>x.emp!==id);S.ded=S.ded.filter(x=>x.emp!==id);S.arr=S.arr.filter(x=>x.emp!==id);Object.keys(S.att).forEach(k=>{if(k.startsWith(id+'|'))delete S.att[k]});save();return render()}
  if(t.dataset.e){const k=t.dataset.e+'|'+M+'|c',a=S.att[k]=S.att[k]||{},d=t.dataset.d,v=CY[(CY.indexOf(a[d]||'')+1)%CY.length];
    if(v)a[d]=v;else delete a[d];save();t.className='c '+v;t.textContent=v||'·';return}
  if(t.dataset.fill){const a={};for(let d=1;d<=dim();d++)a[d]=dow(d)==0?'W':'P';S.att[t.dataset.fill+'|'+M+'|c']=a;save();return render()}
  if(t.dataset.st){const x=S.exp.find(x=>x.id===t.dataset.st);x.status=x.status==='Approved'?'Pending':'Approved';save();return render()}
  if(t.dataset.dx){S.exp=S.exp.filter(x=>x.id!==t.dataset.dx);save();return render()}
  if(t.dataset.dd){S.ded=S.ded.filter(x=>x.id!==t.dataset.dd);save();return render()}
  if(t.dataset.da){S.arr=S.arr.filter(x=>x.id!==t.dataset.da);save();return render()}
});
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.gnote!==undefined){S.notes['ALL|'+M]=t.value;save()}});
const closeMenu=()=>{$('#drawer').classList.remove('on');$('#ov').classList.remove('on')};
$('#menu').onclick=()=>{$('#drawer').classList.add('on');$('#ov').classList.add('on')};
$('#ov').onclick=closeMenu;
const fsb=$('#fs');
if(document.fullscreenEnabled){fsb.hidden=false;
  fsb.onclick=()=>{try{(document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>toast('Full screen is not available in this view'))}catch(e){toast('Full screen is not available in this view')}};
  document.addEventListener('fullscreenchange',()=>{fsb.textContent=document.fullscreenElement?'Exit full screen':'Full screen'})}
$('#mon').onchange=e=>{if(e.target.value){M=e.target.value;IMP=null;render()}};
const showLogin=()=>{$('#login').hidden=false};
async function pull(){
  try{
    const d=await docRef().get();
    if(d.exists&&d.data().json){S=JSON.parse(d.data().json);norm();try{localStorage.setItem('apr1',JSON.stringify(S))}catch(e){}setSync('✓ Synced to cloud')}
    else cloudSave(); // first login: upload what is already on this device
  }catch(e){setSync('⚠ Could not load cloud data')}
}
function boot(){
  if(!fbOn){render();return}
  $('#lo').hidden=false;
  auth.onAuthStateChanged(async u=>{
    if(!u){USER=null;showLogin();return}
    USER=u;$('#login').hidden=true;await pull();render();
  });
}
$('#lgo').onclick=async()=>{
  $('#lerr').textContent='';
  try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  catch(e){$('#lerr').textContent='Sign in failed: '+(e.code||e.message)}
};
$('#lo').onclick=async()=>{await auth.signOut();closeMenu()};
boot();
</script>
