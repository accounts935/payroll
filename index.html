"lo\" hidden>Sign out\u003c/button>\u003c/nav>\n\u003cdiv class=\"shell\">\n  \u003cheader class=\"top\">\n    \u003cdiv class=\"brandrow\">\u003cbutton class=\"btn\" id=\"menu\" aria-label=\"Open menu\">☰ Menu\u003c/button>\u003cimg class=\"lg toplogo\" alt=\"Chouka\">\u003cdiv>\u003cdiv class=\"sub\">Chouka Guwahati\u003c/div>\u003ch1>Attendance &amp; Payroll\u003ci>.\u003c/i>\u003c/h1>\u003c/div>\u003c/div>\n    \u003cdiv class=\"cycle\">\u003clabel>Month\u003cinput type=\"month\" id=\"mon\">\u003c/label>\u003cdiv class=\"cyc-note\" id=\"cyc\">\u003c/div>\u003cbutton class=\"btn\" id=\"fs\" hidden>Full screen\u003c/button>\u003c/div>\n  \u003c/header>\n  \u003cmain id=\"view\">\u003c/main>\n\u003c/div>\n\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst inr=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});\nconst CO='CHOUKA GUWAHATI';\nconst LOGO=\"%%LOGO%%\";\ndocument.querySelectorAll('img.lg').forEach(i=>{i.src=LOGO});\nlet S={emps:[],att:{},exp:[],ded:[],arr:[],notes:{}};\ntry{const r=localStorage.getItem('chouka1');if(r)S=JSON.parse(r)}catch(e){}\nS.emps=S.emps||[];S.att=S.att||{};S.exp=S.exp||[];S.ded=S.ded||[];S.arr=S.arr||[];S.notes=S.notes||{};S.rate=S.rate||4;\nS.ded.forEach(x=>{if(x.type==='Loan EMI'||x.type==='Advance')x.type='Advance/EMI'});\n// Paste your Firebase web app config here (Project settings > Your apps > Web app)\nconst FB={apiKey:'AIzaSyDxr7w0_VwOP_Tw7kCRH2KQvLilcHJddKQ',authDomain:'payrollchouka.firebaseapp.com',projectId:'payrollchouka',appId:'1:233352717263:web:6645514d59c56bfe9868ba'};\nconst fbOn=!!window.firebase&&!FB.apiKey.startsWith('YOUR_');\nlet auth,db;if(fbOn){firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore()}\nlet USER=null,tmr;\nconst setSync=t=>{const e=document.getElementById('sync');if(e)e.textContent=t};\nconst norm=()=>{S.emps=S.emps||[];S.att=S.att||{};S.exp=S.exp||[];S.ded=S.ded||[];S.arr=S.arr||[];S.notes=S.notes||{};S.rate=S.rate||4};\nconst docRef=()=>db.collection('app_state').doc(USER.uid);\nconst SH=n=>db.collection('shared').doc(n),jstr=JSON.stringify;\nlet STAFF=false,base={},lastRoster='',unsub=null;\n// Attendance is stored in its own shared document. Only the days this device changed are merged in, so two people recording at once do not overwrite each other.\nconst pushAtt=async()=>{\n  const ch=[...new Set([...Object.keys(S.att),...Object.keys(base)])].filter(k=>jstr(S.att[k])!==jstr(base[k]));\n  if(!ch.length)return;\n  await db.runTransaction(async t=>{\n    const d=await t.get(SH('attendance'));const r=d.exists?JSON.parse(d.data().json||'{}'):{};\n    ch.forEach(k=>{if(S.att[k])r[k]=S.att[k];else delete r[k]});\n    t.set(SH('attendance'),{json:jstr(r),updated:Date.now()});\n    S.att=r;base=JSON.parse(jstr(r));\n  });\n};\nconst cloudSave=()=>{if(!fbOn||!USER)return;setSync('Saving…');clearTimeout(tmr);tmr=setTimeout(async()=>{try{\n  if(!STAFF){const{att,...rest}=S;await docRef().set({json:jstr(rest),updated:Date.now()});\n    const ro=jstr(S.emps.map(e=>({id:e.id,name:e.name})));if(ro!==lastRoster){await SH('roster').set({json:ro,updated:Date.now()});lastRoster=ro}}\n  await pushAtt();setSync(STAFF?'✓ Attendance saved':'✓ Synced to cloud')}catch(e){setSync('⚠ Not synced - check connection')}},700)};\nconst save=()=>{if(!STAFF){try{localStorage.setItem('chouka1',JSON.stringify(S))}catch(e){}}cloudSave()};\nlet M=(()=>{const t=new Date();const y=t.getFullYear(),m=t.getMonth()+1;return y+'-'+String(m).padStart(2,'0')})(),tab='emp',IMP=null,EDIT=null,DEDIT=null,AEDIT=null;\nconst TABS=[['emp','👥 Employees'],['att','🗓️ Attendance'],['exp','💵 Reimbursement'],['arr','➕ Additional pay'],['ded','➖ Deductions'],['pay','📊 Payroll summary'],['slip','🧾 Salary slip']];\nconst CY=['','P','A','H','L','W','HW','HO'];\nconst dim=()=>{const[y,m]=M.split('-').map(Number);return new Date(y,m,0).getDate()};\nconst dayDate=d=>{const[y,m]=M.split('-').map(Number);return new Date(y,m-1,d)};\nconst iso=t=>t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');\nconst cs=()=>iso(dayDate(1)),ce=()=>iso(dayDate(dim()));\nconst inCyc=d=>d>=cs()&&d\u003c=ce();\nconst fmtD=t=>t.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});\nconst sd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};\nconst dow=d=>dayDate(d).getDay();\nconst uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst isRec=x=>false; // all deductions are one-time (apply only in the cycle of their date)\nconst dedActive=x=>!!DT[x.type]&&(isRec(x)?(x.date\u003c=ce()&&(!x.end||x.end>=cs())):inCyc(x.date));\nconst isRecA=x=>x.rec===undefined?true:!!x.rec;\nconst arrActive=x=>isRecA(x)?(x.date\u003c=ce()&&(!x.end||x.end>=cs())):inCyc(x.date);\nconst SUNDAYS=4; // additional pay days for a month with no weekly off, absence or half day; each weekly off / absent day takes 1 away, each half day takes 0.5 away\nconst dedAmt=(x,e)=>x.basis==='days'?Math.round(e.salary/30*x.val):x.val;\nconst DT={'Penalty':['days',0.5],'Advance/EMI':['amt','']};\nconst KL={'Advance/EMI':'Advance\u003cbr>/EMI'};\nconst ename=id=>(S.emps.find(e=>e.id===id)||{}).name||'(removed)';\nconst opts=()=>S.emps.map(e=>`\u003coption value=\"${e.id}\">${esc(e.name)}\u003c/option>`).join('');\nconst sorted=()=>[...S.emps].sort((a,b)=>a.name.localeCompare(b.name,undefined,{sensitivity:'base'}));\nconst none=()=>'\u003cdiv class=\"card empty\">Add employees first. \u003cbutton class=\"btn s\" data-t=\"emp\">Go to Employees\u003c/button>\u003c/div>';\nconst fit=aoa=>aoa[0].map((_,i)=>({wch:Math.min(42,Math.max(...aoa.map(r=>String(r[i]??'').length))+2)}));\nconst monthLabel=()=>fmtD(dayDate(1))+' to '+fmtD(dayDate(dim()));\nconst C={ink:[46,42,26],acc:[160,111,0],mute:[122,111,77],line:[236,223,180],soft:[255,250,230],bg:[251,246,230],hmute:[255,240,190],accSoft:[252,239,184]};\nfunction brand(doc,x,y){try{doc.addImage(LOGO,'PNG',x,y-9,25.9,14);doc.setFont('courier','bold');doc.setFontSize(9);doc.setTextColor(...C.acc);doc.text('GUWAHATI',x+29,y)}catch(e){doc.setTextColor(...C.ink);doc.setFont('courier','bold');doc.setFontSize(15);doc.text(CO,x,y);doc.setTextColor(...C.acc);doc.text('.',x+doc.getTextWidth(CO),y)}}\nconst fN=n=>Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:0});\n\nfunction calc(e){\n  const a=S.att[e.id+'|'+M+'|c']||{};let c={P:0,A:0,H:0,L:0,W:0,HW:0,HO:0};\n  for(let d=1;d\u003c=dim();d++){const v=a[d];if(v&&c[v]!==undefined)c[v]++}\n  const marked=c.P+c.A+c.H+c.L+c.W+c.HW+c.HO,days=dim();\n  const unpaid=c.A+.5*c.H+(days-marked);\n  const payable=marked===0?0:Math.max(0,30-unpaid);\n  const gross=Math.round(e.salary/30*payable);\n  const dls=S.ded.filter(x=>x.emp===e.id&&dedActive(x)),dby={};\n  Object.keys(DT).forEach(k=>dby[k]=0);\n  dls.forEach(x=>{dby[x.type]=(dby[x.type]||0)+dedAmt(x,e)});\n  const ded=dls.reduce((s,x)=>s+dedAmt(x,e),0),absd=marked===0?0:Math.max(0,e.salary-gross);\n  const addDays=marked===0?0:Math.max(0,SUNDAYS-(c.W+.5*c.HW+c.A+.5*c.H+(days-marked))),add=Math.round(e.salary/30*addDays);\n  return{...c,unmarked:days-marked,payable,gross,addDays,add,ded,absd,tded:ded+absd,dby,net:gross+add-ded};\n}\n\nlet ESQ='',LT=null;\nfunction render(){\n  const same=tab===LT,sy=window.scrollY,aw0=document.querySelector('.attw'),at=aw0?aw0.scrollTop:0,al=aw0?aw0.scrollLeft:0;\n  $('#mon').value=M;$('#cyc').textContent=monthLabel();\n  $('#tabs').innerHTML=(STAFF?TABS.filter(t=>t[0]==='att'):TABS).map(([k,l])=>`\u003cbutton class=\"tab ${k===tab?'on':''}\" data-t=\"${k}\">${l}\u003c/button>`).join('');\n  ({emp:rEmp,att:rAtt,exp:rExp,arr:rArr,ded:rDed,pay:rPay,slip:rSlip})[tab]();\n  if(same){window.scrollTo(0,sy);const aw=document.querySelector('.attw');if(aw){aw.scrollTop=at;aw.scrollLeft=al}}\n  LT=tab;\n}\n\nfunction rEmp(){\n  const ed=EDIT&&S.emps.find(x=>x.id===EDIT),v=k=>esc(ed?ed[k]||'':'');\n  $('#view').innerHTML=`\u003cdiv class=\"card\">\u003ch2 class=\"ct\">${ed?'Edit employee':'Add employee'}\u003c/h2>\n  \u003cdiv class=\"row\">\n  \u003clabel class=\"wide\">Name\u003cinput id=\"en\" value=\"${v('name')}\">\u003c/label>\u003clabel>Employee code\u003cinput id=\"ec\" value=\"${v('code')}\">\u003c/label>\n  \u003clabel>Designation\u003cinput id=\"ed\" value=\"${v('desig')}\">\u003c/label>\u003clabel>Date of joining\u003cinput type=\"date\" id=\"ej\" value=\"${v('doj')}\">\u003c/label>\n  \u003clabel>Monthly salary (₹)\u003cinput id=\"es\" type=\"number\" min=\"0\" value=\"${ed?esc(ed.salary):''}\">\u003c/label>\u003c/div>\n  \u003ch3 class=\"ct2\">Contact and bank details\u003c/h3>\n  \u003cdiv class=\"row\">\n  \u003clabel>Contact number\u003cinput id=\"ep\" type=\"tel\" value=\"${v('phone')}\">\u003c/label>\u003clabel class=\"wide\">Email\u003cinput id=\"ee\" type=\"email\" value=\"${v('email')}\">\u003c/label>\n  \u003clabel>PAN\u003cinput id=\"ex\" maxlength=\"10\" style=\"text-transform:uppercase\" value=\"${v('pan')}\">\u003c/label>\n  \u003clabel class=\"wide\">Bank name\u003cinput id=\"eb\" value=\"${v('bank')}\">\u003c/label>\u003clabel>Account number\u003cinput id=\"ea\" inputmode=\"numeric\" value=\"${v('acc')}\">\u003c/label>\u003clabel>IFSC\u003cinput id=\"ei\" maxlength=\"11\" style=\"text-transform:uppercase\" value=\"${v('ifsc')}\">\u003c/label>\u003c/div>\n  \u003cdiv class=\"toolbar\" style=\"margin-top:14px\">\u003cbutton class=\"btn\" id=\"addE\">${ed?'Save changes':'Add employee'}\u003c/button>${ed?'\u003cbutton class=\"btn s\" id=\"canE\">Cancel\u003c/button>':''}\u003c/div>\u003c/div>\n  \u003cdiv class=\"card fit sc\">${S.emps.length?`\u003cdiv class=\"toolbar\" style=\"margin-bottom:12px\">\u003cinput id=\"esr\" type=\"search\" placeholder=\"Search employees by name, code, designation or contact\" style=\"flex:1;min-width:200px\">\u003cspan clas ush('Employee not found: '+i.miss.map(esc).join(', ')+'. Add them on the Employees tab, or match the name or code exactly.');\n  if(i.badDate)why.push(i.badDate+' row'+(i.badDate==1?'':'s')+' with a missing or unreadable date.');\n  if(i.zero)why.push(i.zero+' row'+(i.zero==1?'':'s')+' with no km and no amount.');\n  return`\u003cdiv class=\"callout\">\u003cdiv>\u003cb>${i.ok} claim${i.ok==1?'':'s'} imported from ${esc(i.file)}\u003c/b>\u003cdiv class=\"note\" style=\"margin:2px 0 0\">Imported claims are Pending until you approve them.${i.outside?' '+i.outside+' dated outside this cycle, so not shown below.':''}\u003c/div>${why.length?`\u003cul>${why.map(w=>`\u003cli>${w}\u003c/li>`).join('')}\u003c/ul>`:''}\u003c/div>\u003cbutton class=\"btn s\" data-x=\"imp\">Dismiss\u003c/button>\u003c/div>`;\n}\n\nfunction rExp(){\n  if(!S.emps.length){$('#view').innerHTML=none();return}\n  S.rate=S.rate||4;\n  const list=S.exp.filter(x=>inCyc(x.date)).sort((a,b)=>a.date\u003cb.date?-1:1);\n  const tot=list.reduce((s,x)=>s+x.amt,0),ap=list.filter(x=>x.status==='Approved').reduce((s,x)=>s+x.amt,0),km=Math.round(list.reduce((s,x)=>s+(x.km||0),0)*100)/100;\n  const pend=list.filter(x=>x.status!=='Approved').length;\n  $('#view').innerHTML=`\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003cspan>Distance\u003c/span>\u003cb>${km.toLocaleString('en-IN')} km\u003c/b>\u003c/div>\u003cdiv class=\"kpi\">\u003cspan>Rate\u003c/span>\u003cb>₹${S.rate} per km\u003c/b>\u003c/div>\u003cdiv class=\"kpi\">\u003cspan>Claimed\u003c/span>\u003cb>${inr(tot)}\u003c/b>\u003c/div>\u003cdiv class=\"kpi hi\">\u003cspan>Approved\u003c/span>\u003cb>${inr(ap)}\u003c/b>\u003c/div>\u003c/div>\n  ${impBox()}\n  \u003cdiv class=\"card\">\u003ch2 class=\"ct\">Rate and Excel import\u003c/h2>\n  \u003cdiv class=\"ratebox\">\u003cdiv>\u003cdiv class=\"big\">₹${S.rate}\u003csmall> per km\u003c/small>\u003c/div>\u003c/div>\n  \u003clabel style=\"width:140px\">Change rate (₹ per km)\u003cinput id=\"xr\" type=\"number\" min=\"0\" step=\"any\" value=\"${S.rate}\">\u003c/label>\n  \u003cdiv class=\"note\" style=\"margin:0;flex:1 1 240px\">Amount = km travelled × ₹${S.rate}. Overwrite the amount for tickets or other fixed fares. A new rate applies to new entries only.\u003c/div>\u003c/div>\n  \u003cdiv class=\"drop\" id=\"drop\" tabindex=\"0\">\u003cdiv class=\"txt\">\u003cb>Import reimbursement claims from Excel or CSV\u003c/b>\u003cdiv class=\"note\" style=\"margin-top:4px\">Drop a .xlsx, .xls or .csv file here, or choose one. Columns: Employee, Date, From, To, Mode, Purpose, Km, Amount (optional), Status (optional). A blank Amount becomes Km × ₹${S.rate}. The employee name or code must already exist.\u003c/div>\u003c/div>\n  \u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" id=\"xi\">Choose file\u003c/button>\u003cbutton class=\"btn s\" id=\"xt2\">Download template\u003c/button>\u003cbutton class=\"btn s\" id=\"xo\">Export cycle to Excel\u003c/button>\u003c/div>\u003cinput type=\"file\" id=\"xf2\" accept=\".xlsx,.xls,.csv\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003ch2 class=\"ct\">Add expense\u003c/h2>\u003cdiv class=\"row\">\n  \u003clabel>Employee\u003cselect id=\"xe\">${opts()}\u003c/select>\u003c/label>\u003clabel>Date\u003cinput type=\"date\" id=\"xd\" value=\"${cs()}\">\u003c/label>\n  \u003clabel>From\u003cinput id=\"xf\">\u003c/label>\u003clabel>To\u003cinput id=\"xt\">\u003c/label>\n  \u003clabel>Mode\u003cselect id=\"xm\">\u003coption>Bike\u003c/option>\u003coption>Bus\u003c/option>\u003coption>Train\u003c/option>\u003coption>Auto/Taxi\u003c/option>\u003coption>Car\u003c/option>\u003coption>Other\u003c/option>\u003c/select>\u003c/label>\n  \u003clabel class=\"wide\">Purpose\u003cinput id=\"xp\">\u003c/label>\n  \u003clabel>Km travelled\u003cinput id=\"xk\" type=\"number\" min=\"0\" step=\"any\">\u003c/label>\n  \u003clabel>Amount (₹)\u003cinput id=\"xa\" type=\"number\" min=\"0\" placeholder=\"km × ₹${S.rate}\">\u003c/label>\n  \u003cbutton class= Total additional pay\u003c/td>\u003ctd class=\"n\">${inr(tot)}\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>`:'\u003cdiv class=\"empty\">No employees yet.\u003c/div>'}\u003c/div>`;\n}\n\nfunction rDed(){\n  if(!S.emps.length){$('#view').innerHTML=none();return}\n  const em=id=>S.emps.find(e=>e.id===id);\n  const ed=DEDIT&&S.ded.find(x=>x.id===DEDIT);\n  const list=S.ded.filter(dedActive).sort((a,b)=>a.date\u003cb.date?-1:1);\n  const amt=x=>em(x.emp)?dedAmt(x,em(x.emp)):0;\n  const tot=list.reduce((s,x)=>s+amt(x),0);\n  $('#view').innerHTML=`\u003cdiv class=\"card\">\u003ch2 class=\"ct\">${ed?'Edit deduction':'Add deduction'}\u003c/h2>\u003cdiv class=\"row\">\n  \u003clabel>Employee\u003cselect id=\"de\">${opts()}\u003c/select>\u003c/label>\u003clabel>Date / starts on\u003cinput type=\"date\" id=\"dd\" value=\"${ed?ed.date:cs()}\">\u003c/label>\n  \u003clabel>Type\u003cselect id=\"dt\">${Object.keys(DT).map(k=>`\u003coption>${k}\u003c/option>`).join('')}\u003c/select>\u003c/label>\n  \u003clabel>Deduct as\u003cselect id=\"db\">\u003coption value=\"days\">Days of salary\u003c/option>\u003coption value=\"amt\">Fixed amount (₹)\u003c/option>\u003c/select>\u003c/label>\n  \u003clabel>Value\u003cinput id=\"dv\" type=\"number\" min=\"0\" step=\"any\">\u003c/label>\n  \u003clabel class=\"wide\">Note\u003cinput id=\"dn\" value=\"${esc(ed?ed.note:'')}\">\u003c/label>\n  \u003cbutton class=\"btn\" id=\"addD\">${ed?'Save changes':'Add deduction'}\u003c/button>${ed?'\u003cbutton class=\"btn s\" id=\"canD\">Cancel\u003c/button>':''}\u003c/div>\n  \u003cdiv class=\"note\">Advance/EMI and Penalty are one-time. Each entry is deducted only in the cycle of its date and does not continue to later months. Penalty defaults to 0.5 day of salary (daily rate = salary ÷ 30).\u003c/div>\u003c/div>\n  \u003cdiv class=\"card fit sc\">${list.length?`\u003ctable>\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Employee\u003c/th>\u003cth>Type\u003c/th>\u003cth>Basis\u003c/th>\u003cth>Note\u003c/th>\u003cth class=\"n\">Amount\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${list.map(x=>`\u003ctr>\u003ctd title=\"${x.date}\">${sd(x.date)}\u003c/td>\u003ctd>${esc(ename(x.emp))}\u003c/td>\u003ctd>${esc(x.type)}${isRec(x)?' \u003cspan class=\"note\" style=\"margin:0\">↻ monthly\u003c/span>':''}\u003c/td>\u003ctd>${x.basis==='days'?x.val+' day(s)':'Fixed'}\u003c/td>\u003ctd>${esc(x.note)||'–'}\u003c/td>\u003ctd class=\"n\">${inr(amt(x))}\u003c/td>\u003ctd>\u003cbutton class=\"btn s\" data-dedit=\"${x.id}\">Edit\u003c/button> ${isRec(x)?`\u003cbutton class=\"btn s\" data-dstop=\"${x.id}\">Stop\u003c/button> `:''}\u003cbutton class=\"btn d\" data-dd=\"${x.id}\">Delete\u003c/button>\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"5\">Total deductions\u003c/td>\u003ctd class=\"n\">${inr(tot)}\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>`:'\u003cdiv class=\"empty\">No deductions this cycle.\u003c/div>'}\u003c/div>`;\n  const set=()=>{const d=DT[$('#dt').value];$('#db').value=d[0];$('#dv').value=d[1]};\n  $('#dt').onchange=set;\n  if(ed){$('#de').value=ed.emp;$('#dt').value=ed.type;$('#db').value=ed.basis;$('#dv').value=ed.val}else set();\n  $('#addD').onclick=()=>{const v=parseFloat($('#dv').value),d=$('#dd').value;if(!(v>0)||!d)return;\n    const o={emp:$('#de').value,date:d,type:$('#dt').value,basis:$('#db').value,val:v,note:$('#dn').value.trim(),rec:false};\n    if(ed)Object.assign(ed,o);else S.ded.push({id:uid(),...o});DEDIT=null;save();render()};\n  if(ed)$('#canD').onclick=()=>{DEDIT=null;render()};\n}\n\nfunction rPay(){\n  const R=sorted().map(e=>({e,c:calc(e)}));\n  const K=Object.keys(DT);\n  const T=R.reduce((t,{c})=>({g:t.g+c.gross,d:t.d+c.tded,ab:t.ab+c.absd,n:t.n+c.net,a:t.a+c.add}),{g:0,d:0,ab:0,n:0,a:0});\n  const kt=k=>R.reduce((s,{c})=>s+c.dby[k],0);\n  $('#view').innerHTML=`\u003cdiv class=\"kpis\">\u003cdiv class=\"kpi\">\u003cspan>Employees\u003c/span>\u003cb>${R.length}\u003c/b>\u003c/div>\u003cdiv class=\"kpi\">\u003cspan>Gross pay\u003c/span>\u003cb>${inr(T.g)}\u003c/b>\u003c/div>\u003cdiv class=\"kpi\">\u003cspan>Deductions\u003c/span>\u003cb>${inr(T.d)}\u003c/b>\u003c/div>\u003cdiv class=\"kpi hi\">\u003cspan>Net payable\u003c/span>\u003cb>${inr(T.n)}\u003c/b>\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"toolbar\">\u003cbutton class=\"btn\" id=\"pdf\">Export PDF\u003c/button>\u003cbutton class=\"btn\" id=\"xls\">Export Excel\u003c/button>\u003cbutton class=\"btn s\" id=\"csv\">Export CSV\u003c/button>\u003cbutton class=\"btn s\" id=\"bak\">Export backup\u003c/button>\u003clabel class=\"btn s\">Import backup\u003cinput type=\"file\" id=\"imp\" accept=\".json\">\u003c/label>\u003c/div>\u003c/div>\n  \u003cdiv class=\"card sc pay\">${R.length?`\u003ctable>\u003cthead>\u003ctr>\u003cth>Employee\u003c/th>\u003cth class=\"n\">Salary\u003c/th>\u003cth class=\"n\">P\u003c/th>\u003cth class=\"n\">H\u003c/th>\u003cth class=\"n\">L\u003c/th>\u003cth class=\"n\">W\u003c/th>\u003cth class=\"n\">HW\u003c/th>\u003cth class=\"n\">HO\u003c/th>\u003cth class=\"n\">A\u003c/th>\u003cth class=\"n\">Payable\u003cbr>days\u003c/th>\u003cth class=\"n\">Gross\u003cbr>pay\u003c/th>\u003cth class=\"n\">Additional\u003cbr>pay\u003c/th>\u003cth class=\"n\">Absent\u003cbr>/half ded.\u003c/th>${K.map(k=>`\u003cth class=\"n\">${KL[k]||k}\u003c/th>`).join('')}\u003cth class=\"n\">Total\u003cbr>ded.\u003c/th>\u003cth class=\"n\">Net\u003cbr>pay\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${R.map(({e,c})=>`\u003ctr>\u003ctd class=\"name\">${esc(e.name)}\u003c/td>\u003ctd class=\"n\">${inr(e.salary)}\u003c/td>\u003ctd class=\"n\">${c.P}\u003c/td>\u003ctd class=\"n\">${c.H}\u003c/td>\u003ctd class=\"n\">${c.L}\u003c/td>\u003ctd class=\"n\">${c.W}\u003c/td>\u003ctd class=\"n\">${c.HW}\u003c/td>\u003ctd class=\"n\">${c.HO}\u003c/td>\u003ctd class=\"n\">${c.A}\u003c/td>\u003ctd class=\"n\">${c.payable}\u003c/td>\u003ctd class=\"n\">${inr(c.gross)}\u003c/td>\u003ctd class=\"n\">${c.add?inr(c.add):'–'}\u003c/td>\u003ctd class=\"n\">${c.absd?inr(c.absd):'-'}\u003c/td>${K.map(k=>`\u003ctd class=\"n\">${c.dby[k]?inr(c.dby[k]):'–'}\u003c/td>`).join('')}\u003ctd class=\"n\">${inr(c.tded)}\u003c/td>\u003ctd class=\"n netc\">${inr(c.net)}\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd>Total\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd class=\"n\">${inr(T.g)}\u003c/td>\u003ctd class=\"n\">${inr(T.a)}\u003c/td>\u003ctd class=\"n\">${inr(T.ab)}\u003c/td>${K.map(k=>`\u003ctd class=\"n\">${inr(kt(k))}\u003c/td>`).join('')}\u003ctd class=\"n\">${inr(T.d)}\u003c/td>\u003ctd class=\"n\">${inr(T.n)}\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>`:'\u003cdiv class=\"empty\">Add employees and attendance to see the summary.\u003c/div>'}\n  \u003cdiv class=\"note\" style=\"margin-top:12px\">P present · H half day · L paid leave · W weekly off · HW half-day weekend · HO holiday (paid) · A absent. Employees are listed A to Z.\u003c/div>\u003c/div>\n  \u003cdiv class=\"card\">\u003clabel>Notes for ${monthLabel()} (included in the PDF)\u003ctextarea data-gnote rows=\"3\" placeholder=\"Type any manual note for this month’s payroll…\">${esc(S.notes['ALL|'+M]||'')}\u003c/textarea>\u003c/label>\n  \u003cdetails class=\"how\">\u003csummary>How pay is calculated\u003c/summary>\u003cp>Attendance runs on the calendar month, from the 1st to the last day of the selected month. Salary is always based on 30 days: daily rate = monthly salary ÷ 30. Payable days = 30 − unpaid days, where unpaid days = Absent + ½ Half day + Unmarked days. So a full-attendance month (28, 30 or 31 days) always earns the full salary. Gross pay = daily rate × payable days. Additional pay = daily rate × additional days. Additional days = 4 − (weekly offs + ½ × half-day weekends + absent days + ½ × half days + unmarked days), never below 0, so a month with no weekly off or absence earns 4 extra days, 1 weekly off earns 3, 2 earn 2, 3 earn 1. Net pay = Gross + additional pay − deductions. Paid leave (L), weekly off (W), half-day weekend (HW) and holiday (HO) are paid, so nothing is deducted for them. Total ded. = Absent/half-day deduction (salary minus gross pay) + the other deductions entered; net pay is not affected by this split. A month with nothing marked pays 0.\u003c/p>\u003c/details>\u003c/div>`;\n  const hdr=['Employee','Salary','Present','Half day','Paid leave','Weekly off','Half-day weekend','Holiday','Absent','Payable days','Gross pay','Additional pay','Absent/half-day deduction',...K,'Total deductions','Net pay'];\n  // Exports leave out employees with no attendance marked at all for the month\n  const RX=R.filter(({c})=>c.unmarked\u003cdim());\n  const TX=RX.reduce((t,{c})=>({g:t.g+c.gross,d:t.d+c.tded,ab:t.ab+c.absd,n:t.n+c.net,a:t.a+c.add}),{g:0,d:0,ab:0,n:0,a:0});\n  const ktx=k=>RX.reduce((t,{c})=>t+c.dby[k],0);\n  const body=RX.map(({e,c})=>[e.name,e.salary,c.P,c.H,c.L,c.W,c.HW,c.HO,c.A,c.payable,c.gross,c.add,c.absd,...K.map(k=>c.dby[k]),c.tded,c.net]);\n  $('#csv').onclick=()=>{const q=v=>'\"'+String(v).replace(/\"/g,'\"\"')+'\"';\n    dl('payroll-'+M+'.csv','text/csv','﻿'+[hdr,...body].map(r=>r.map(q).join(',')).join('\\n'))};\n  $('#xls').onclick=()=>{\n    if(!window.XLSX){toast('Excel library failed to load. Reload the page and try again.');return}\n    if(!RX.length){toast('Nothing to export yet. No employee has attendance marked.');return}\n    const tot=['Total','','','','','','','','','',TX.g,TX.a,TX.ab,...K.map(ktx),TX.d,TX.n];\n    const aoa=[hdr,...body,tot];const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=fit(aoa);\n    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Payroll');\n    dl('payroll-'+M+'.xlsx','application/octet-stream',XLSX.write(wb,{type:'array',bookType:'xlsx'}))};\n  $('#pdf').onclick=()=>{if(!RX.length){toast('Nothing to export yet. No employee has attendance marked.');return}payPdf(RX,TX,K)};\n  $('#bak').onclick=()=>dl('attendance-backup.json','application/json',JSON.stringify(S));\n  $('#imp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.emps&&d.att&&d.exp){S=d;S.ded=S.ded||[];S.arr=S.arr||[];S.notes=S.notes||{};S.rate=S.rate||4;save();render();toast('Backup imported')}else toast('That file is not a payroll backup')}catch(e){toast('That file is not a payroll backup')}};r.readAsText(f);ev.target.value=''};\n}\nfunction drawRupee(doc,x,base,h,w){\n  doc.setLineWidth(Math.max(.18,h*.11));doc.setLineCap(0);\n  doc.line(x,base-h,x+w,base-h);doc.line(x,base-h*.68,x+w,base-h*.68);\n  doc.lines([[w*.5,0],[w*.55,0,w*.55,h*.5,0,h*.5],[-w*.5,0],[w*.75,h*.48]],x+w*.05,base-h,[1,1],'S',false);\n}\nfunction payPdf(R,T,K){try{\n  const J=window.jspdf;if(!J){toast('PDF library failed to load. Reload the page and try again.');return}\n  const doc=new J.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});\n  const W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();\n  doc.setFillColor(...C.bg);doc.rect(0,0,W,26,'F');doc.setFillColor(...C.acc);doc.rect(0,26,W,1.2,'F');\n  brand(doc,10,12);\n  doc.setFont('courier','normal');doc.setFontSize(8);doc.setTextColor(...C.mute);\n  doc.text('PAYROLL SUMMARY',10,20);\n  doc.setFont('courier','bold');doc.setFontSize(9);doc.setTextColor(...C.ink);doc.text(monthLabel(),W-10,12,{align:'right'});\n  const head=[['Employee','Salary','P','H','L','W','HW','HO','A','Payable\\ndays','Gross\\npay','Additional\\npay','Absent/\\nhalf ded.',...K.map(k=>(KL[k]||k).replace('\u003cbr>','\\n')),'Total\\nded.','Net\\npay']];\n  const body=R.map(({e,c})=>[e.name,fN(e.salary),c.P,c.H,c.L,c.W,c.HW,c.HO,c.A,c.payable,fN(c.gross),fN(c.add),c.absd?fN(c.absd):'-',...K.map(k=>c.dby[k]?fN(c.dby[k]):'-'),fN(c.tded),'  '+fN(c.net)]);\n  const foot=[['Total','','','','','','','','','',fN(T.g),fN(T.a),fN(T.ab),...K.map(k=>fN(R.reduce((s,{c})=>s+c.dby[k],0))),fN(T.d),'  '+fN(T.n)]];\n  const last=head[0].length-1;\n  doc.autoTable({head,body,foot,startY:34,theme:'plain',margin:{left:10,right:10,bottom:24},showFoot:'lastPage',\n    styles:{font:'courier',fontSize:7,cellPadding:{top:2.2,bottom:2.2,left:1.8,right:1.8},textColor:C.ink,lineColor:C.line,lineWidth:{bottom:.2},cellWidth:'wrap',valign:'middle'},\n    headStyles:{fillColor:C.bg,textColor:C.mute,fontStyle:'bold',fontSize:6.5,lineColor:C.line,lineWidth:{bottom:.3}},\n    footStyles:{fillColor:C.soft,textColor:C.ink,fontStyle:'bold'},\n    alternateRowStyles:{fillColor:C.soft},\n    columnStyles:{0:{cellWidth:'auto',fontStyle:'bold',halign:'left'}},\n    didParseCell:h=>{const i=h.column.index;\n      if(i>0)h.cell.styles.halign=h.section==='head'?'center':'right';\n      if(i===last&&h.section!=='head'){h.cell.styles.fontStyle='bold';if(h.section==='body')h.cell.styles.fillColor=C.accSoft}},\n    didDrawCell:h=>{if(h.column.index!==last||h.section==='head')return;\n      const c=h.cell,fs=c.styles.fontSize,txt=String(c.text[0]||'').trim();if(!txt)return;\n      doc.setFont('courier','bold');doc.setFontSize(fs);\n      const pad=typeof c.padding==='function'?c.padding('right'):1.8,tw=doc.getTextWidth(txt),sh=fs*.3528*.7,sw=sh*.72;\n      const xr=c.x+c.width-pad,base=c.y+c.height/2+fs*.3528*.35;\n      doc.setDrawColor(...C.ink);drawRupee(doc,xr-tw-sw-.5,base,sh,sw)}});\n  let y=doc.lastAutoTable.finalY+7;const gn=(S.notes['ALL|'+M]||'').trim();\n  if(y>H-46){doc.addPage();y=20}\n  if(gn){doc.setFont('courier','bold');doc.setFontSize(8);doc.setTextColor(...C.ink);doc.text('Notes',10,y);doc.setFont('courier','normal');const ls=doc.splitTextToSize(gn,W-20);doc.text(ls,10,y+4.5);y+=7+ls.length*3.6}\n  doc.setFont('courier','normal');doc.setFontSize(7);doc.setTextColor(...C.mute);\n  doc.text('Gross pay = Salary / 30 x payable days. Additional pay = Salary / 30 x additional days, where additional days = 4 - (weekly offs + 0.5 x half-day weekends + absent days + 0.5 x half days), minimum 0. Net pay = Gross + Additional pay - Deductions. Total ded. = Absent/half-day deduction (Salary - Gross) + other deductions. P present, H half day, L paid leave, W weekly off · HW half-day weekend, HO holiday (paid), A absent. Employees listed A to Z.',10,y,{maxWidth:W-20});\n  doc.setDrawColor(...C.ink);doc.setLineWidth(.3);doc.setTextColor(...C.ink);\n  doc.line(10,H-22,70,H-22);doc.text('Prepared by',10,H-18);\n  doc.line(W-70,H-22,W-10,H-22);doc.text('Approved by',W-70,H-18);\n  const n=doc.getNumberOfPages();\n  for(let p=1;p\u003c=n;p++){doc.setPage(p);doc.setFontSize(7);doc.setTextColor(...C.mute);doc.text(CO+'  |  Payroll '+monthLabel(),10,H-7);doc.text('Page '+p+' of '+n,W-10,H-7,{align:'right'});doc.text('Generated from Chouka Management Software',W/2,H-3.5,{align:'center'})}\n  dl('payroll-'+M+'.pdf','application/pdf',doc.output('arraybuffer'));\n}catch(err){toast('PDF error: '+err.message)}}\n\nfunction toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>{t.style.display='none'},5000)}\nasync function dl(name,type,data){\n  try{\n    const d=window.claude?await claude.use('downloads'):null;\n    if(d){await d.save({filename:name,data});toast('Saved '+name);return}\n  }catch(e){if(e&&e.code==='declined'){toast('Save cancelled');return}toast('Save failed ('+((e&&(e.code||e.message))||e)+'). Trying a direct download.')}\n  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Downloading '+name)}catch(e){toast('Export is not available in this view')}\n}\n\ndocument.addEventListener('click',ev=>{\n  const t=ev.target.closest('button');if(!t)return;\n  if(t.dataset.t){tab=t.dataset.t;EDIT=null;closeMenu();return render()}\n  if(t.dataset.edit){EDIT=t.dataset.edit;render();try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}return}\n  if(t.dataset.x==='imp'){IMP=null;return render()}\n  if(t.dataset.x==='appall'){S.exp.forEach(x=>{if(inCyc(x.date)&&x.status!=='Approved')x.status='Approved'});save();return render()}\n  if(t.dataset.del){\n    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Confirm delete';clearTimeout(t._t);t._t=setTimeout(()=>{t.dataset.arm='';t.textContent='Delete'},3500);return}\n    const id=t.dataset.del;S.emps=S.emps.filter(e=>e.id!==id);S.exp=S.exp.filter(x=>x.emp!==id);S.ded=S.ded.filter(x=>x.emp!==id);S.arr=S.arr.filter(x=>x.emp!==id);Object.keys(S.att).forEach(k=>{if(k.startsWith(id+'|'))delete S.att[k]});save();return render()}\n  if(t.dataset.e){const k=t.dataset.e+'|'+M+'|c',a=S.att[k]=S.att[k]||{},d=t.dataset.d,v=CY[(CY.indexOf(a[d]||'')+1)%CY.length];\n    if(v)a[d]=v;else delete a[d];save();t.className='c '+v;t.textContent=v||'·';return}\n  if(t.dataset.fill){const id=t.dataset.fill,a={};for(let d=1;d\u003c=dim();d++)a[d]='P';S.att[id+'|'+M+'|c']=a;save();document.querySelectorAll('button.c[data-e]').forEach(b=>{if(b.dataset.e===id){b.className='c P';b.textContent='P'}});return}\n  if(t.dataset.st){const x=S.exp.find(x=>x.id===t.dataset.st);x.status=x.status==='Approved'?'Pending':'Approved';save();return render()}\n  if(t.dataset.dx){S.exp=S.exp.filter(x=>x.id!==t.dataset.dx);save();return render()}\n  if(t.dataset.dedit){DEDIT=t.dataset.dedit;return render()}\n  if(t.dataset.dstop){const x=S.ded.find(x=>x.id===t.dataset.dstop);if(x){const last=iso(dayDate(0));if(x.date>last)S.ded=S.ded.filter(y=>y!==x);else x.end=last;save();render();toast('Stopped from this cycle onward')}return}\n  if(t.dataset.dd){const x=S.ded.find(x=>x.id===t.dataset.dd);if(x&&isRec(x)&&!confirm('This is a monthly deduction. Deleting removes it from ALL months, including past ones. Use St e new lists */\nconst LEGACY_CAT = { \"Produce\": \"Vegetables\" };\nconst LEGACY_STORE = { \"Open Storage\": \"Open Storage\", \"Walk-in Fridge\": \"Walk-in Fridge\", \"Deep Fridge\": \"Deep Fridge\", \"Bakery Station\": \"Open Storage\" };\nconst fixIng = i => ({ ...i, category: LEGACY_CAT[i.category] || i.category, storage: LEGACY_STORE[i.storage] || i.storage });\nconst EPS = 0.001;\n\n/* Cloud layout (Firestore):\n   ingredients/{id}  one doc per ingredient\n   logs/{ingredientId}  { days: { \"YYYY-MM-DD\": {in, w, u, notes} } }\n   stockIn/{id}, cons/{id}, waste/{id}  one doc per entry                         */\nconst blank = () => ({ ing: [], logs: {}, stockIn: [], cons: [], waste: [] });\nlet S = blank();\nlet user = null, authReady = false, ready = false, shadow = new Map(), pending = 0, unsubs = [];\nlet lastId = 0;\nconst newId = () => { let v = Date.now() * 1000 + Math.floor(Math.random() * 1000); if (v \u003c= lastId) v = lastId + 1; return (lastId = v); };\n\nconst ser = o => JSON.stringify(Object.keys(o).sort().reduce((a, k) => (a[k] = o[k], a), {}));\nfunction desired(){\n  const m = new Map();\n  for (const i of S.ing) { const { id, ...rest } = i; m.set(`ingredients/${id}`, ser(rest)); }\n  for (const id of Object.keys(S.logs)) for (const [d, e] of Object.entries(S.logs[id] || {})) m.set(`logs/${id}#${d}`, ser({ in: e.in || 0, w: e.w || 0, u: e.u || 0, notes: e.notes || \"\" }));\n  for (const [c, arr] of [[\"stockIn\", S.stockIn], [\"cons\", S.cons], [\"waste\", S.waste]]) for (const x of arr) { const { id, ...rest } = x; m.set(`${c}/${id}`, ser(rest)); }\n  return m;\n}\n/** Called after every change: works out what changed and writes only that to Firestore. */\nfunction save(){\n  if (!ready) return;\n  const next = desired(), ops = [];\n  for (const [k, v] of next) if (shadow.get(k) !== v) ops.push([\"set\", k, v]);\n  for (const k of shadow.keys()) if (!next.has(k)) ops.push([\"del\", k]);\n  shadow = next; commit(ops);\n}\nfunction commit(ops){\n  if (!ops.length) return;\n  const gone = new Set(), batches = []; let b = writeBatch(db), n = 0;\n  const add = fn => { fn(b); if (++n >= 400) { batches.push(b); b = writeBatch(db); n = 0; } };\n  for (const [kind, k, v] of ops) {\n    if (k.startsWith(\"logs/\")) {\n      const [id, date] = k.slice(5).split(\"#\"), ref = doc(db, \"logs\", id);\n      if (kind === \"set\") add(x => x.set(ref, { days: { [date]: JSON.parse(v) } }, { merge: true }));\n      else if (!ingById(id)) { if (!gone.has(id)) { gone.add(id); add(x => x.delete(ref)); } }\n      else add(x => x.set(ref, { days: { [date]: deleteField() } }, { merge: true }));\n    } else {\n      const [c, id] = k.split(\"/\"), ref = doc(db, c, id);\n      if (kind === \"set\") add(x => x.set(ref, JSON.parse(v))); else add(x => x.delete(ref));\n    }\n  }\n  if (n) batches.push(b);\n  for (const x of batches) {\n    pending++; setStat();\n    x.commit().catch(e => toast(\"Could not save to the cloud: \" + (e.code || e.message), true)).finally(() => { pending--; setStat(); });\n  }\n}\nfunction setStat(){\n  const el = document.getElementById(\"syncstat\"); if (!el) return;\n  el.textContent = !navigator.onLine ? \"⚠ Offline — changes sync when back online\" : pending ? \"☁ Saving…\" : \"☁ Saved to cloud\";\n}\n\n/* ---- live sync from Firestore ---- */\nfunction stopSync(){ unsubs.forEach(f => f()); unsubs = []; }\nfunction startSync(){\n  stopSync();\n  const seen = new Set(), items = snap => snap.docs.map(d => ({ ...d.data(), id: Number(d.id) }));\n  const watch = (name, apply) => unsubs.push(onSnapshot(collection(db, name), snap => {\n    apply(snap); seen.add(name); shadow = desired();\n    if (!ready) { if (seen.size === 5) { ready = true; render(); } }\n    else if (!snap.metadata.hasPendingWrites) refresh();\n  }, err => { UI.fatal = err.code === \"permission-denied\" ? \"Access denied by Firestore rules. Check that your email is allowed in the rules (see README).\" : (err.message || String(err)); render(); }));\n  watch(\"ingredients\", s => { S.ing = items(s).map(fixIng); });\n  watch(\"stockIn\", s => { S.stockIn = items(s); });\n  watch(\"cons\", s => { S.cons = items(s); });\n  watch(\"waste\", s => { S.waste = items(s); });\n  watch(\"logs\", s => { const l = {}; s.docs.forEach(d => { l[d.id] = d.data().days || {}; }); S.logs = l; });\n}\n/** Another device changed data: refresh the screen unless the person is in the middle of typing. */\nfunction refresh(){\n  const a = document.activeElement;\n  if (UI.dirty || (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && ![\"gdate\",\"gmonth\",\"isearch\",\"icat\"].includes(a.id))) {\n    if (!UI.stale) { UI.stale = true; toast(\"Another device updated the data. This page refreshes after you save or change page.\"); }\n    return;\n  }\n  render();\n}\nfunction doLogin(f){\n  const msg = { \"auth/invalid-credential\": \"Wrong email or password\", \"auth/invalid-email\": \"That email address is not valid\", \"auth/too-many-requests\": \"Too many attempts — try again in a few minutes\", \"auth/network-request-failed\": \"No internet connection\" };\n  signInWithEmailAndPassword(auth, (f.email || \"\").trim(), f.password || \"\").catch(e => toast(msg[e.code] || \"Sign-in failed: \" + (e.code || e.message), true));\n}\nconst loginView = () => `\u003cdiv style=\"min-height:100vh;display:grid;place-items:center;padding:20px\">\u003cform data-form=\"login\" class=\"card pad\" style=\"width:100%;max-width:380px\">\u003cdiv style=\"text-align:center;padding:0 0 14px\">\u003cimg src=\"${LOGO}\" alt=\"Chouka\" style=\"width:70%;height:auto\">\u003cdiv style=\"letter-spacing:.32em;font-weight:700;font-size:10px;color:#78350f;margin-top:4px\">GUWAHATI\u003c/div>\u003c/div>\u003ch3>Sign in\u003c/h3>\u003clabel>Email\u003c/label>\u003cinput type=\"email\" name=\"email\" required autocomplete=\"username\">\u003clabel>Password\u003c/label>\u003cinput type=\"password\" name=\"password\" required autocomplete=\"current-password\">
