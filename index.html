er;cursor:pointer;color:#fff;background:#b45309;border:1px solid #b45309;border-radius:12px}\n#login p,#login .note{margin:12px 0;font-size:12px;color:#6b5a35;max-width:none}\n#login #lerr{margin:10px 0 0;color:#b91c1c}\n#login #lerr:empty{display:none}\n.locked [data-add],.locked .x button{display:none!important}\n.locked input{background:#f3ecd2!important}\n#lockbar{background:#047857;color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;margin-bottom:12px}\n#lockbar[hidden]{display:none}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"login\" class=\"noprint\">\u003cform id=\"lf\">\u003cdiv style=\"text-align:center;padding:0 0 14px\">\u003cimg class=\"lg\" alt=\"Chouka\" style=\"width:70%;height:auto\">\u003cdiv style=\"letter-spacing:.32em;font-weight:700;font-size:10px;color:#78350f;margin-top:4px\">GUWAHATI\u003c/div>\u003c/div>\u003ch3>Sign in\u003c/h3>\u003clabel>Email\u003c/label>\u003cinput type=\"email\" id=\"lem\" required autocomplete=\"username\">\u003clabel>Password\u003c/label>\u003cinput type=\"password\" id=\"lpw\" required autocomplete=\"current-password\">\u003cbutton class=\"btn pri\">Sign in\u003c/button>\u003cdiv class=\"note\" id=\"lerr\">\u003c/div>\u003cp class=\"note\">Accounts are created by the owner in the Firebase console.\u003c/p>\u003c/form>\u003c/div>\n\u003cdiv class=\"shell\">\n\u003caside class=\"noprint\">\n  \u003cdiv class=\"brand\" style=\"flex-direction:column;align-items:stretch;gap:6px\">\u003cimg class=\"logoimg lg\" alt=\"Chouka\">\u003csmall style=\"text-align:center\">GUWAHATI\u003c/small>\u003c/div>\n  \u003cnav>\u003cbutton class=\"on\" data-v=\"rep\">\u003cspan>📝\u003c/span>\u003cspan>Today's report\u003c/span>\u003c/button>\u003cbutton data-v=\"his\">\u003cspan>📚\u003c/span>\u003cspan>Saved reports\u003c/span>\u003c/button>\u003c/nav>\n  \u003cdiv id=\"st\" class=\"stat\">Ready\u003c/div>\n\u003c/aside>\n\u003cmain>\n\u003cheader class=\"top noprint\">\n  \u003cdiv class=\"ttl\">\u003csmall class=\"b\">CHOUKA GUWAHATI\u003c/small>\u003ch1 id=\"h1\">Daily Cash Closing Report\u003c/h1>\u003cp id=\"hp\">Enter the day's figures — totals and variance calculate automatically\u003c/p>\u003c/div>\n  \u003cinput type=\"date\" id=\"date\" style=\"width:auto\" aria-label=\"Business date\">\u003cbutton class=\"btn sm pri\" id=\"submit\">Submit report\u003c/button>\u003cbutton class=\"btn sm\" id=\"print\">Print / PDF\u003c/button>\u003cbutton class=\"btn sm\" id=\"share\">Share summary\u003c/button>\u003cbutton class=\"btn sm red\" id=\"del\">Delete\u003c/button>\u003cspan class=\"muted\" id=\"who\">\u003c/span>\u003cbutton class=\"btn sm\" id=\"lo\">Sign out\u003c/button>\n\u003c/header>\n\u003cdiv class=\"content\">\n\u003cdiv id=\"v-rep\" class=\"rpt\">\n  \u003cdiv id=\"lockbar\" class=\"noprint\" hidden>\u003c/div>\n  \u003cdiv class=\"sh-top\">\n    \u003cdiv>\u003cimg class=\"sheet-logo lg\" alt=\"Chouka\">\u003cdiv class=\"sheet-brand\">GUWAHATI\u003c/div>\u003c/div>\n    \u003cdiv>\u003cdiv class=\"sheet-title\">DAILY CASH CLOSING REPORT\u003c/div>\u003cdiv class=\"sheet-sub\">\u003cspan id=\"dtxt\">–\u003c/span> · \u003cspan id=\"day\">–\u003c/span>\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"f3\">\u003cdiv>\u003clabel>Prepared By (Cashier)\u003c/label>\u003cinput id=\"by\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv>\u003clabel>Verified By (Manager)\u003c/label>\u003cinput id=\"ver\" type=\"text\" autocomplete=\"off\">\u003c/div>\u003cdiv class=\"noprint\">\u003clabel>Business Date\u003c/label>\u003cinput id=\"date2\" type=\"date\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"sum5\">\u003cdiv class=\"sc\">\u003csmall>Total sales\u003c/small>\u003cb id=\"sc1\">–\u003c/b>\u003c/div>\u003cdiv class=\"sc\">\u003csmall>Closing cash (B)\u003c/small>\u003cb id=\"sc2\">–\u003c/b>\u003c/div>\u003cdiv class=\"sc\">\u003csmall>Cash counted (C)\u003c/small>\u003cb id=\"sc3\">–\u003c/b>\u003c/div>\u003cdiv class=\"sc\">\u003csmall>Variance (C − B)\u003c/small>\u003cb id=\"sc4\">–\u003c/b>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">1. SALES BREAKDOWN — CHANNEL &amp; PAYMENT MODE\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Channel / Payment Mode\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b1\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd>TOTAL SALES FOR THE DAY\u003c/td>\u003ctd class=\"r v\" id=\"totSales\">–\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">2. CASH &amp; BANK RECONCILIATION (BALANCE SHEET)\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Particulars\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b2\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd>CLOSING CASH IN DRAWER (B)\u003c/td>\u003ctd class=\"r v\" id=\"B\">–\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">3. CASH DENOMINATION COUNT (PHYSICAL)\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Denomination\u003c/th>\u003cth class=\"r\">Qty.\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b3\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"2\">TOTAL CASH COUNTED (C)\u003c/td>\u003ctd class=\"r v\" id=\"C\">–\u003c/td>\u003c/tr>\u003ctr>\u003ctd colspan=\"2\">VARIANCE (C – B) — must be NIL\u003c/td>\u003ctd class=\"r v\" id=\"var\">–\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">4. RESTAURANT CASH EXPENSE REGISTER\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Item\u003c/th>\u003cth class=\"r\">Qty.\u003c/th>\u003cth class=\"r\">Rate (₹)\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003cth class=\"x\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b_ex\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"3\">TOTAL RESTAURANT CASH EXPENDITURE\u003c/td>\u003ctd class=\"r v\" id=\"t_ex\">–\u003c/td>\u003ctd class=\"x\">\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003cbutton class=\"btn sm noprint\" data-add=\"ex\" style=\"margin-top:8px\">+ Add row\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">5. OWNER PERSONAL DUE\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Name of Owner\u003c/th>\u003cth>Bill No.\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003cth class=\"x\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b_ow\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"2\">TOTAL OWNER DUE PAYMENTS\u003c/td>\u003ctd class=\"r v\" id=\"t_ow\">–\u003c/td>\u003ctd class=\"x\">\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003cbutton class=\"btn sm noprint\" data-add=\"ow\" style=\"margin-top:8px\">+ Add row\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">6. COMPLIMENTARY / COMPS SHEET\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Guest / Occasion\u003c/th>\u003cth>Reason\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003cth class=\"x\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b_cp\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd colspan=\"2\">TOTAL COMPLIMENTARY VALUE\u003c/td>\u003ctd class=\"r v\" id=\"t_cp\">–\u003c/td>\u003ctd class=\"x\">\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003cbutton class=\"btn sm noprint\" data-add=\"cp\" style=\"margin-top:8px\">+ Add row\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">7. VERIFICATION &amp; SIGN-OFF\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Prepared by – Cashier\u003c/th>\u003cth>Verified by – Manager\u003c/th>\u003cth>Approved by – Owner\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>\u003cinput data-sig=\"c\" type=\"text\" placeholder=\"Name / Signature / Time\">\u003c/td>\u003ctd>\u003cinput data-sig=\"m\" type=\"text\" placeholder=\"Name / Signature / Time\">\u003c/td>\u003ctd>\u003cinput data-sig=\"o\" type=\"text\" placeholder=\"Name / Signature / Time\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n\n  \u003cdiv class=\"sheet-sec\">\u003cdiv class=\"sheet-h\">NAME WISE TOTAL DUE AMOUNT\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Name\u003c/th>\u003cth class=\"r\">Amount (₹)\u003c/th>\u003cth class=\"x\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"b_du\">\u003c/tbody>\u003ctfoot>\u003ctr>\u003ctd>TOTAL DUE AMOUNT\u003c/td>\u003ctd class=\"r v\" id=\"t_du\">–\u003c/td>\u003ctd class=\"x\">\u003c/td>\u003c/tr>\u003c/tfoot>\u003c/table>\u003c/div>\u003cbutton class=\"btn sm noprint\" data-add=\"du\" style=\"margin-top:8px\">+ Add row\u003c/button>\u003c/div>\n\u003cdiv class=\"gen-foot\" id=\"genfoot\">\u003c/div>\n\u003c/div>\n\u003cdiv id=\"v-his\" hidden>\u003c/div>\n\u003c/div>\n\u003c/main>\n\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];\nconst n=v=>parseFloat(v)||0;\nconst fm=x=>'₹'+(+x||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst vf=v=>v===0?'NIL ✓':v\u003c0?`(${fm(-v)}) Short`:`${fm(v)} Excess`;\nconst fd=d=>new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).replace(/ /g,'-');\nconst dn=d=>d?new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long'}):'–';\nconst esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/\"/g,'&quot;').replace(/\u003c/g,'&lt;');\nconst LOGO=\"%%LOGO%%\";$$('.lg').forEach(i=>i.src=LOGO);\nconst KEY='chouka_cash_v2';let DB={},LOCK=false,dirty=false;const CC=window.CC={save:null,del:null,submit:null};\nlet R={},prev=null,L={ex:[],ow:[],cp:[],du:[]};\n\nconst SALES=[['dineCash','Dine-in – Table Sales (Cash)','lr'],['dineUpi','Dine-in – Table Sales (UPI)','lr'],['dineCard','Dine-in – Table Sales (Card)','lr'],['dineDue','Dine-in – Table Sales (Due)','lb'],['pickCash','Pick-up – Parcel (Cash)','lm'],['pickUpi','Pick-up – Parcel (UPI)','lm'],['pickCard','Pick-up – Parcel (Card)','lm'],['zomato','Online – Zomato (settled/collected today)',''],['swiggy','Online – Swiggy (settled/collected today)','']];\nconst LINK=[['dineDue','Sales Due'],['dineUpi','UPI Sales'],['dineCard','Card Sales'],['pickUpi','Pick-up – Parcel (UPI)'],['pickCard','Pick-up – Parcel (Card)'],['zomato','Zomato'],['swiggy','Swiggy']];\nconst DEN=[['n500',500,'₹ 500 notes'],['n200',200,'₹ 200 notes'],['n100',100,'₹ 100 notes'],['n50',50,'₹ 50 notes'],['n20',20,'₹ 20 notes'],['n10',10,'₹ 10 notes'],['c20',20,'₹ 20 coins'],['c10',10,'₹ 10 coins'],['n5',5,'₹ 5 notes'],['c2',2,'₹ 2 coins'],['c1',1,'₹ 1 coins']];\nconst SP={ex:[['i','t'],['q','n'],['r','n']],ow:[['n','t'],['b','t'],['a','n']],cp:[['g','t'],['r','t'],['a','n']],du:[['n','t'],['a','n']]};\nconst MIN={ex:5,ow:3,cp:3,du:3};\n\nconst inp=(k,q)=>`\u003cinput data-k=\"${k}\" type=\"number\" inputmode=\"${q?'numeric':'decimal'}\" min=\"0\" step=\"${q?1:'any'}\" placeholder=\"0\">`;\nconst V=(id,c)=>`\u003cspan class=\"v ${c||''}\" id=\"${id}\">–\u003c/span>`;\nconst T=(l,c,r,x)=>`\u003ctr class=\"${c||''}\">\u003ctd>${l}\u003c/td>${x||''}\u003ctd class=\"r${x?'':' in1'}\">${r}\u003c/td>\u003c/tr>`;\n$('#b1').innerHTML=SALES.map(([k,l,c])=>T(`\u003cspan class=\"${c}\">${l}\u003c/span>`,'',inp(k))).join('');\n$('#b2').innerHTML=\n  T('Opening Balance / Cash Float Carried Forward','',inp('open'))+\n  '\u003ctr class=\"noprint\">\u003ctd colspan=\"2\" class=\"muted\" id=\"carry\">\u003c/td>\u003c/tr>'+\n  T('Add: Total Sales for the Day','',V('s2Sales','g'))+\n  T(\"Add: Cash Received from Owner's Account (ACC)\",'',inp('acc'))+\n  T('TOTAL AMOUNT AVAILABLE (A)','cat-s',V('A'))+\n  T('Less: Bank Deposit Made Today/Cash out','',inp('bank'))+\n  T('Less: Restaurant Cash Expenditure (Section 4 total)','',V('exp','g'))+\n  T('Less: Sales Not Physically in Drawer (digital / receivable):','cat-s','')+\n  LINK.map(([k,l])=>T(`\u003cspan class=\"ind\">${l}\u003c/span>`,'',V('l_'+k,'g'))).join('');\n$('#b3').innerHTML=DEN.map(([k,m,l])=>T(l,'',V('a_'+k),`\u003ctd class=\"r in2\">${inp(k,1)}\u003c/td>`)).join('')+\n  `\u003ctr class=\"cat-s\">\u003ctd colspan=\"2\">Notes Total\u003c/td>\u003ctd class=\"r v\" id=\"notes\">–\u003c/td>\u003c/tr>`+\n  `\u003ctr>\u003ctd colspan=\"2\">Coins / Loose Change\u003c/td>\u003ctd class=\"r in1\">${inp('loose')}\u003c/td>\u003c/tr>`;\n\nconst cell=(t,i,f,k,v)=>`\u003ctd${k==='n'?' class=\"r in1\"':''}>\u003cinput data-t=\"${t}\" data-i=\"${i}\" data-f=\"${f}\" ${k==='n'?'type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"any\"':'type=\"text\"'} value=\"${esc(v)}\">\u003c/td>`;\nfunction rL(t){\n  $('#b_'+t).innerHTML=L[t].map((x,i)=>`\u003ctr>${SP[t].map(([f,k])=>cell(t,i,f,k,x[f])).join('')}${t==='ex'?`\u003ctd class=\"r v\" id=\"ea${i}\">–\u003c/td>`:''}\u003ctd class=\"x\">\u003cbutton class=\"btn sm\" data-del=\"${t}:${i}\" aria-label=\"Remove row\">✕\u003c/button>\u003c/td>\u003c/tr>`).join('');\n}\nconst blank=t=>Object.fromEntries(SP[t].map(([f])=>[f,'']));\nconst sum=(t,f)=>L[t].reduce((s,x)=>s+n(x[f]),0);\nconst set=(id,x,always)=>{$('#'+id).textContent=(x||always)?fm(x):'–'};\n\nfunction calc(){\n  const g=k=>n((document.querySelector(`[data-k=\"${k}\"]`)||{}).value);\n  const tot=SALES.reduce((s,[k])=>s+g(k),0);set('totSales',tot,1);set('s2Sales',tot);\n  const A=g('open')+tot+g('acc');set('A',A,1);\n  let exp=0;L.ex.forEach((x,i)=>{const a=n(x.q)*n(x.r);exp+=a;set('ea'+i,a)});set('t_ex',exp,1);set('exp',exp);\n  let dig=0;LINK.forEach(([k])=>{set('l_'+k,g(k));dig+=g(k)});\n  const B=A-g('bank')-exp-dig;set('B',B,1);\n  let notes=0;DEN.forEach(([k,m])=>{const a=g(k)*m;notes+=a;set('a_'+k,a)});set('notes',notes,1);\n  const C=notes+g('loose');set('C',C,1);\n  const v=Math.round((C-B)*100)/100,cls=v===0?'ok':v\u003c0?'bad':'warn';\n  $('#var').className='v '+cls;$('#var').textContent=vf(v);\n  set('t_ow',sum('ow','a'),1);set('t_cp',sum('cp','a'),1);set('t_du',sum('du','a'),1);\n  $('#sc1').textContent=fm(tot);$('#sc2').textContent=fm(B);$('#sc3').textContent=fm(C);\n  $('#sc4').className=cls;$('#sc4').textContent=vf(v);\n  R={tot,exp,B,C,v,A};\n}\nfunction collect(){\n  const vals={};$$('[data-k]').forEach(i=>{if(i.value!=='')vals[i.dataset.k]=i.value});\n  const sig={};$$('[data-sig]').forEach(i=>sig[i.dataset.sig]=i.value);\n  const o={by:$('#by').value,ver:$('#ver').value,vals,sig,...R};\n  Object.keys(L).forEach(t=>o[t]=L[t].filter(x=>Object.values(x).some(v=>v!=='')));\n  return o;\n}\nfunction apply(st){\n  $$('[data-k]').forEach(i=>i.value=(st.vals||{})[i.dataset.k]||'');\n  $$('[data-sig]').forEach(i=>i.value=(st.sig||{})[i.dataset.sig]||'');\n  $('#by').value=st.by||'';$('#ver').value=st.ver||'';\n  Object.keys(L).forEach(t=>{L[t]=(st[t]||[]).map(x=>({...x}));while(L[t].length\u003cMIN[t])L[t].push(blank(t));rL(t)});\n  calc();\n}\nconst lastOf=d=>{const ks=Object.keys(DB).filter(k=>k\u003cd&&DB[k]).sort();return ks.length?DB[ks[ks.length-1]]:null};\nconst prevOf=d=>{const ks=Object.keys(DB).filter(k=>k\u003cd&&DB[k]&&DB[k].submitted).sort();return ks.length?{d:ks[ks.length-1],...DB[ks[ks.length-1]]}:null};\nfunction setLock(on){\n  LOCK=on;\n  $$('#v-rep input').forEach(i=>{if(i.id!=='date2')i.readOnly=on});\n  $('#v-rep').classList.toggle('locked',on);\n  $('#submit').hidden=on;$('#del').hidden=on;\n  const b=$('#lockbar');b.hidden=!on;\n  if(on){const s=DB[$('#date').value]||{};\n    b.textContent='🔒 Submitted'+(s.submittedAt?' on '+new Date(s.submittedAt).toLocaleString('en-IN'):'')+(s.submittedBy?' by '+s.submittedBy:'')+'. This report is locked and cannot be changed. Cash counted ('+fm(s.C)+') becomes the next day\\'s opening.'}\n}\nfunction carry(){\n  prev=prevOf($('#date').value);\n  const o=$('[data-k=\"open\"]');\n  if(!LOCK){if(prev){o.value=prev.C;o.readOnly=true}else o.readOnly=false;calc()}\n  $('#carry').innerHTML=prev?`Opening is carried forward automatically from the submitted report of ${fd(prev.d)} (cash counted ${fm(prev.C)}).`:(LOCK?'':'No submitted report before this date. Enter the opening balance manually (first report only).');\n}\nfunction load(d){\n  $('#date').value=d;$('#date2').value=d;$('#dtxt').textContent=fd(d);$('#day').textContent=dn(d);\n  if(DB[d])apply(DB[d]);\n  else{const p=prevOf(d),q=lastOf(d);apply({by:localStorage.getItem(KEY+'_by')||'',vals:p?{open:p.C}:{},du:q&&q.du?q.du:[]})}\n  setLock(!!(DB[d]&&DB[d].submitted));carry();\n}\nlet tm;\nfunction doSave(){\n  const d=$('#date').value;\n  if(!d||LOCK||(DB[d]&&DB[d].submitted))return Promise.resolve();\n  const o=collect();DB[d]=o;\n  try{localStorage.setItem(KEY+'_by',$('#by').value)}catch(e){}\n  if(!CC.save){$('#st').textContent='⚠ Not connected to the cloud';return Promise.resolve()}\n  $('#st').textContent='Saving…';\n  return CC.save(d,o).then(()=>{if(DB[d]===o)dirty=false;$('#st').textContent='✓ Saved to cloud'})\n    .catch(e=>{$('#st').textContent='⚠ Not saved to cloud — '+((e&&(e.code||e.message))||e)});\n}\nfunction persist(){if(LOCK)return;dirty=true;$('#st').textContent='Saving…';clearTimeout(tm);tm=setTimeout(doSave,600)}\nfunction flush(){if(dirty&&!LOCK){clearTimeout(tm);return doSave()}}\nCC.legacy=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}};\nCC.ingest=function(items,removed,first){\n  const cur=$('#date').value;let reload=!!first;\n  items.forEach(({id,x})=>{\n    let o={};try{o=JSON.parse(x.json||'{}')}catch(e){}\n    o.submitted=!!x.submitted;if(x.submittedAt)o.submittedAt=x.submittedAt;if(x.submittedBy)o.submittedBy=x.submittedBy;\n    if(id===cur){\n      if(o.submitted&&!LOCK){reload=true;dirty=false;clearTimeout(tm)}\n      else if(!o.submitted&&dirty)return;\n    }\n    DB[id]=o;\n  });\n  removed.forEach(id=>{if(id===cur&&dirty)return;delete DB[id];if(id===cur)reload=true});\n  if(reload&&!(dirty&&!LOCK))load(cur);else carry();\n  if(!$('#v-his').hidden)rH();\n};\nCC.reset=()=>{DB={};dirty=false;clearTimeout(tm);load($('#date').value||new Date().toISOString().slice(0,10))};\nfunction rH(){\n  const ks=Object.keys(DB).sort().reverse();\n  $('#v-his').innerHTML=`\u003cdiv class=\"rpt\">\u003cdiv class=\"sheet-h\">Saved reports (${ks.length}) — stored in the cloud\u003c/div>\u003cdiv class=\"sheet-scroll\">\u003ctable class=\"sheet-table\">\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Day\u003c/th>\u003cth>Cashier\u003c/th>\u003cth class=\"r\">Total sales\u003c/th>\u003cth class=\"r\">Expenses\u003c/th>\u003cth class=\"r\">Closing (B)\u003c/th>\u003cth class=\"r\">Counted (C)\u003c/th>\u003cth class=\"r\">Variance\u003c/th>\u003cth>Status\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${ks.map(k=>{const s=DB[k];return`\u003ctr>\u003ctd>${fd(k)}\u003c/td>\u003ctd>${dn(k)}\u003c/td>\u003ctd>${esc(s.by)}\u003c/td>\u003ctd class=\"r\">${fm(s.tot)}\u003c/td>\u003ctd class=\"r\">${fm(s.exp)}\u003c/td>\u003ctd class=\"r\">${fm(s.B)}\u003c/td>\u003ctd class=\"r\">${fm(s.C)}\u003c/td>\u003ctd class=\"r v ${s.v===0?'ok':s.v\u003c0?'bad':'warn'}\">${vf(s.v||0)}\u003c/td>\u003ctd>${s.submitted?'🔒 Submitted':'Draft'}\u003c/td>\u003ctd>\u003cbutton class=\"btn sm\" data-open=\"${k}\">Open\u003c/button>\u003c/td>\u003c/tr>`}).join('')||'\u003ctr>\u003ctd colspan=\"10\" class=\"empty\">No saved reports yet. Enter figures in Today\\'s report and they save automatically.\u003c/td>\u003c/tr>'}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>`;\n}\nfunction view(v){flush();\n  $('#v-rep').hid d);delete DB[d];load(d);$('#st').textContent='Draft deleted'}\n  catch(e){alert('Could not delete: '+((e&&(e.code||e.message))||e))}\n};\n$('#submit').onclick=async()=>{\n  const d=$('#date').value;if(LOCK||!d)return;\n  if(!CC.submit){alert('Not connected to the cloud. Sign in and check the internet connection.');return}\n  if(!$('#by').value.trim()){alert('Enter \"Prepared By (Cashier)\" before submitting.');$('#by').focus();return}\n  calc();\n  const msg='Submit the report for '+fd(d)+'?\\n\\nAfter submitting, it is LOCKED and can never be edited or overwritten.\\nCash counted '+fm(R.C)+' will become the next day\\'s opening.'+(R.v!==0?'\\n\\n⚠ Variance is '+vf(R.v)+' (should be NIL).':'');\n  if(!confirm(msg))return;\n  clearTimeout(tm);dirty=false;\n  const o=collect();\n  try{\n    $('#st').textContent='Submitting…';\n    const meta=await CC.submit(d,o);\n    Object.assign(o,meta,{submitted:true});DB[d]=o;\n    setLock(true);carry();\n    $('#st').textContent='✓ Submitted & locked';\n  }catch(e){\n    $('#st').textContent='⚠ Not submitted';\n    alert(e&&e.message==='locked'?'This date was already submitted (possibly from another device). It cannot be changed.':'Could not submit: '+((e&&(e.code||e.message))||e));\n  }\n};\n$('#share').onclick=async()=>{\n  const d=$('#date').value,t=['CHOUKA – Daily Cash Closing Report',fd(d)+' ('+dn(d)+')','Cashier: '+($('#by').value||'–'),'',\n    'Total sales: '+fm(R.tot),'Cash expenditure: '+fm(R.exp),'Closing cash in drawer (B): '+fm(R.B),'Total cash counted (C): '+fm(R.C),'Variance: '+vf(R.v),'','Generated from Chouka Management Software'].join('\\n');\n  try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);$('#st').textContent='Summary copied'}}catch(e){}\n};\nload(new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10));\n\u003c/script>\n\u003cscript type=\"module\">\nimport { initializeApp } from \"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js\";\nimport { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from \"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js\";\nimport { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, getFirestore, collection, doc, onSnapshot, setDoc, deleteDoc, runTransaction } from \"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js\";\n// Sign-in and data both use the cashclosing project (same email/password screen).\nconst app = initializeApp({\n  apiKey: \"AIzaSyCiqltEgFUSbAhZPy1rfb-QvEZM16zJ90A\",\n  authDomain: \"cashclosing.firebaseapp.com\",\n  projectId: \"cashclosing\",\n  storageBucket: \"cashclosing.firebasestorage.app\",\n  messagingSenderId: \"269966279731\",\n  appId: \"1:269966279731:web:3bc7972b212c55f7cc8f46\"\n}, \"cash\");\nconst auth = getAuth(app);\nlet db;\ntry { db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }\ncatch (e) { db = getFirestore(app); }\nconst CC = window.CC;\nconst col = \"closings\";\nconst who = () => (auth.currentUser && auth.currentUser.email) || \"\";\n// Draft saves (queued offline, sent when back online). Rules must refuse updates to submitted reports.\nCC.save = (d, o) => setDoc(doc(db, col, d), { json: JSON.stringify(o), submitted: false, updated: Date.now(), by: who() });\nCC.del = d => deleteDoc(doc(db, col, d));\n// Submit: online only, and refused if that date was already submitted by anyone.\nCC.submit = (d, o) => runTransaction(db, async t => {\n  const r = doc(db, col, d), s = await t.get(r);\n  if (s.exists() && s.data().submitted) throw new Error(\"locked\");\n  const meta = { submittedAt: Date.now(), submittedBy: who() };\n  t.set(r, { json: JSON.stringify({ ...o, ...meta, submitted: true }), submitted: true, submittedAt: meta.submittedAt, submittedBy: meta.submittedBy, updated: meta.submittedAt, by: who() });\n  return meta;\n});\nasync function migrate(snap) {\n  try {\n    if (loca \"\";\n  document.getElementById(\"who\").textContent = u ? u.email : \"\";\n  if (unsub) { unsub(); unsub = null; }\n  if (u) start();\n  else { document.getElementById(\"lpw\").value = \"\"; CC.reset(); }\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"</script>

  document.getElementById('bar-logo').src=LOGO;
  var host=document.getElementById('frames');
  var apps={
    pay:{btn:document.getElementById('b-pay'),id:'d-pay',title:'Attendance & Payroll',f:null},
    stock:{btn:document.getElementById('b-stock'),id:'d-stock',title:'Stock Management',f:null},
    cash:{btn:document.getElementById('b-cash'),id:'d-cash',title:'Daily Cash Closing Report',f:null}
  };
  var src=function(id){return JSON.parse(document.getElementById(id).textContent).split('%'+'%LOGO%'+'%').join(LOGO)};
  function mount(title,html){
    var f=document.createElement('iframe');
    f.title=title;f.setAttribute('allow','fullscreen; clipboard-write');
    host.appendChild(f);
    var d=f.contentDocument;d.open();d.write(html);d.close();
    return f;
  }
  function show(w){
    if(!apps[w])w='pay';
    if(!apps[w].f)apps[w].f=mount(apps[w].title,src(apps[w].id));
    Object.keys(apps).forEach(function(k){
      var a=apps[k];if(a.f)a.f.hidden=k!==w;
      a.btn.classList.toggle('on',k===w);
    });
    try{sessionStorage.setItem('chk-view',w)}catch(e){}
  }
  window.addEventListener('message',function(e){
    var m=e.data;
    if(m&&m.type==='chouka-reload'&&apps.pay.f&&e.source===apps.pay.f.contentWindow){
      apps.pay.f.remove();apps.pay.f=null;show('pay');
    }
  });
  Object.keys(apps).forEach(function(k){apps[k].btn.onclick=function(){show(k)}});
  var last='pay';try{last=sessionStorage.getItem('chk-view')||'pay'}catch(e){}
  show(last);
})();
</script>
